<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problemáticas de Kennedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --fg:#f4f4f4; --muted:#8a8a8a; --line:#2e2e2e;
    --root:#ffffff; --p1:#ff5a36; --p2:#ffd23f; --p3:#3ec6ff;
    --f:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f);
    user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;cursor:grab;
    background-color:#000;background-image:radial-gradient(#202020 1px,transparent 1.2px);background-size:28px 28px}
  #stage.drag{cursor:grabbing}
  svg#graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

  /* ---- aristas ---- */
  .link{stroke:#3a3a3a;stroke-width:1.6;fill:none;animation:fade .6s;transition:stroke .2s,opacity .25s}
  .link.hot{stroke:var(--c);stroke-width:3;stroke-dasharray:8 7;animation:flow .9s linear infinite}
  .link.dim{opacity:.1}
  @keyframes flow{to{stroke-dashoffset:-15}}
  @keyframes fade{from{opacity:0}}

  /* ---- nodos ---- */
  .node{cursor:pointer;transition:opacity .25s}
  .node.dim{opacity:.14}
  .body{transform-box:fill-box;transform-origin:center;animation:pop .65s cubic-bezier(.2,1.25,.3,1)}
  @keyframes pop{from{transform:scale(0)}}
  .hov{transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
  .node:hover .hov{transform:scale(1.14)}
  .disc{stroke-width:3;transition:stroke-width .2s}
  .d0 .disc{fill:#fff;stroke:#fff}
  .d0 .ico{color:#000}
  .d1 .disc{fill:var(--c);stroke:var(--c)}
  .d1 .ico{color:#000}
  .d2 .disc{fill:#000;stroke:var(--c)}
  .d2 .ico{color:var(--c)}
  .node:hover .disc{stroke-width:5}
  .ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .ping{fill:none;stroke:var(--c);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite;pointer-events:none}
  .d0 .ping{stroke:#fff}
  .node.open .ping{display:none}
  @keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(1.9);opacity:0}}
  .node.flash .hov{animation:flash .5s ease-in-out 4}
  @keyframes flash{50%{transform:scale(1.4)}}
  .badge circle{fill:var(--c);stroke:#000;stroke-width:2.5}
  .d0 .badge circle{fill:var(--p1)}
  .badge text{fill:#000;font:700 11px var(--f);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lbl{font:500 13px var(--f);fill:#eee;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:#000;stroke-width:5px;stroke-linejoin:round}
  .d1 .lbl{font:700 14px var(--f);fill:#fff;text-transform:uppercase;letter-spacing:.6px}
  .d0 .lbl{font:700 17px var(--f);fill:#fff;text-transform:uppercase;letter-spacing:.8px}

  /* ---- interfaz (plana, sin brillos) ---- */
  #title{position:fixed;left:32px;top:28px;pointer-events:none;z-index:5}
  #title h1{font:700 44px/.95 var(--f);letter-spacing:-1.5px;text-transform:uppercase}
  #title h1 span{color:var(--p1)}
  #title p{font:400 13px/1.5 var(--f);color:var(--muted);margin-top:14px;max-width:290px}
  #search{position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:7;width:min(380px,calc(100vw - 420px))}
  #q{width:100%;background:#000;color:#fff;border:1.5px solid #3a3a3a;border-radius:0;padding:12px 14px;font:500 14px var(--f);outline:none;transition:border-color .2s}
  #q:focus{border-color:#fff}
  #q::placeholder{color:#777}
  #res{background:#0b0b0b;border:1.5px solid #fff;border-top:0;display:none;max-height:300px;overflow:auto}
  #res.show{display:block}
  #res div{padding:10px 14px;font:400 13px/1.35 var(--f);cursor:pointer;display:flex;gap:10px;align-items:center;border-left:4px solid var(--c)}
  #res div:hover,#res div.act{background:#1c1c1c}
  #hint{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:5;pointer-events:none;
    font:500 13px var(--f);letter-spacing:2px;text-transform:uppercase;color:#000;background:#fff;padding:10px 16px;
    animation:bounce 1.6s ease-in-out infinite;transition:opacity .4s}
  #hint.hide{opacity:0}
  @keyframes bounce{50%{transform:translate(-50%,-8px)}}
  #legend{position:fixed;left:32px;bottom:30px;z-index:5;display:flex;flex-direction:column;gap:10px;font:400 13px var(--f);color:#cfcfcf}
  #legend span{display:flex;align-items:center;gap:12px}
  #legend i{width:14px;height:14px;border-radius:50%;display:inline-block;background:currentColor}
  #legend em{font-style:normal;color:#d6d6d6}
  #tools{position:fixed;right:24px;bottom:24px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{background:#000;color:#fff;border:1.5px solid #3a3a3a;border-radius:0;padding:11px 16px;
    font:500 12px var(--f);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  button:hover{background:#fff;color:#000;border-color:#fff}
  #card{position:fixed;right:24px;top:24px;width:min(340px,calc(100vw - 48px));z-index:6;padding:20px 22px 20px;
    background:#0b0b0b;border:1.5px solid #2e2e2e;border-left:8px solid var(--c,#fff);
    opacity:0;transform:translateX(14px);transition:opacity .2s,transform .2s;pointer-events:none}
  #card.show{opacity:1;transform:none}
  #card .tag{font:500 11px var(--f);letter-spacing:1.6px;text-transform:uppercase;color:var(--c)}
  #card h2{font:700 21px/1.2 var(--f);margin:8px 0 14px;letter-spacing:-.3px}
  #card .path{font:400 13px/1.55 var(--f);color:#9a9a9a;border-top:1px solid #262626;padding-top:12px}
  #card .path b{color:#e4e4e4;font-weight:500}
  #card .more{margin-top:12px;font:500 11px var(--f);letter-spacing:1.4px;text-transform:uppercase;color:#fff}
  @media (max-width:900px){
    #search{left:auto;right:24px;transform:none;top:auto;bottom:80px;width:calc(100vw - 48px)}
    #res{position:absolute;bottom:100%;border-top:1.5px solid #fff;border-bottom:0}
    #hint{bottom:150px}
  }
  @media (max-width:640px){
    #title h1{font-size:30px} #title p{display:none} #legend{display:none}
    #card{top:auto;bottom:140px;right:12px;left:12px;width:auto}
  }
</style>
</head>
<body>
<div id="stage"><svg id="graph"><g id="vp"><g id="links"></g><g id="nodes"></g></g></svg></div>

<div id="title">
  <h1>Problemáticas<br>de <span>Kennedy</span></h1>
  <p>Mapa causal de la fragmentación territorial. Toca, arrastra y explora cada conexión.</p>
</div>
<div id="search"><input id="q" placeholder="Buscar una problemática…" autocomplete="off"><div id="res"></div></div>
<div id="hint">Toca la esfera blanca</div>
<div id="legend">
  <span style="color:var(--p1)"><i></i><em>Hiperconcentración del mercado mayorista</em></span>
  <span style="color:var(--p2)"><i></i><em>Saturación de los residuos</em></span>
  <span style="color:var(--p3)"><i></i><em>Degradación del soporte ecológico</em></span>
</div>
<div id="tools">
  <button id="bExpand">Expandir todo</button>
  <button id="bReset">Reiniciar</button>
  <button id="bFit">Ajustar</button>
  <button id="bIn">+</button>
  <button id="bOut">−</button>
</div>
<div id="card"><div class="tag"></div><h2></h2><div class="path"></div><div class="more"></div></div>

<script src="lib/d3.min.js"></script>
<script src="lib/lucide.min.js"></script>
<script>
/* ---------- Datos (tablero de Miro) · i = icono Lucide · s = etiqueta corta ---------- */
const DATA = {
  t:"La Fragmentación Territorial", i:"Puzzle", c:[
  { t:"Hiperconcentración del mercado mayorista", i:"Store", color:"--p1", c:[
      { t:"Dependencia alimentaria", i:"ShoppingBasket", c:[
        { t:"Pérdida de producción local", i:"Sprout", c:[
          { t:"Modelo económico: más rentable convertir tierra rural en suelo urbano", s:"Tierra rural convertida en suelo urbano", i:"Banknote", c:[
            { t:"Crecimiento demográfico acelerado", i:"Users", c:[
              { t:"Expulsión violenta de millones de campesinos de sus tierras rurales", s:"Expulsión violenta de campesinos", i:"Tractor" }
            ]}
          ]}
        ]}
      ]},
      { t:"Modelo de higiene estatal y salubridad pública", i:"SprayCan", c:[
        { t:"Crisis epidémicas y brotes de enfermedades infecciosas", s:"Crisis epidémicas y brotes infecciosos", i:"Biohazard", c:[
          { t:"Descomposición acelerada de alimentos al aire libre", i:"Apple", c:[
            { t:"Carencia de infraestructura tecnológica", i:"Cpu", c:[
              { t:"Industrialización tardía del país", i:"Factory", c:[
                { t:"La monoexportación cafetera", i:"Coffee" }
              ]}
            ]}
          ]}
        ]}
      ]},
      { t:"Sobrecarga de la red de transporte", i:"Bus", c:[
        { t:"Concentración espacial de origen y destino", i:"MapPin", c:[
          { t:"Densificación residencial en altura", i:"Building2", c:[
            { t:"Especulación del suelo", i:"TrendingUp", c:[
              { t:"Escasez de suelo", i:"Layers" }
            ]}
          ]},
          { t:"Clusters laborales", i:"Briefcase", c:[
            { t:"Proceso histórico de expansión monocéntrica de Bogotá", s:"Expansión monocéntrica de Bogotá", i:"Target", c:[
              { t:"Economías de aglomeración", i:"Network" }
            ]}
          ]}
        ]},
        { t:"Desplazamientos masivos en franjas horarias específicas", s:"Desplazamientos masivos por franjas horarias", i:"Footprints", c:[
          { t:"Factores culturales e institucionales estandarizados", i:"Landmark" },
          { t:"Modelo de sincronización industrial y horarios rígidos", i:"Settings" }
        ]}
      ]}
  ]},
  { t:"Saturación de los residuos", i:"Trash2", color:"--p2", c:[
      { t:"Presión sobre los sistemas de saneamiento", i:"Gauge", c:[
        { t:"Generación de aguas residuales", i:"Droplet", c:[
          { t:"Cargas contaminantes en aguas superficiales", i:"FlaskConical" }
        ]}
      ]}
  ]},
  { t:"Degradación de la capacidad de soporte ecológico", i:"Globe", color:"--p3", c:[
      { t:"Deterioro de la calidad del aire", i:"Wind", c:[
        { t:"Emisiones de NO₂ y CO", i:"Car" }
      ]},
      { t:"Deterioro de la calidad del agua", i:"Droplets" },
      { t:"Pérdida de la biodiversidad", i:"Bird", c:[
        { t:"Falta de disponibilidad de hábitats naturales", i:"TreePine" }
      ]},
      { t:"Vulnerabilidad frente a eventos de lluvia", i:"CloudRain" },
      { t:"Planificación urbana orientada al mercado y no a la descentralización", s:"Planificación urbana orientada al mercado", i:"PencilRuler", c:[
        { t:"Transformación en superficies construidas", i:"Construction", c:[
          { t:"Alteración de las condiciones del suelo", i:"Mountain" },
          { t:"Impermeabilización del suelo", i:"BrickWall" },
          { t:"Fragmentación de la cobertura vegetal", i:"Scissors" },
          { t:"Pérdida de la cobertura vegetal", i:"Leaf" }
        ]}
      ]}
  ]}
]};
DATA.c = [DATA.c[0], DATA.c[2], DATA.c[1]];   // mercado abajo · ecológico izq/arriba · residuos derecha

/* ---------- Preparación del árbol ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let all = [], idn = 0;
function prep(n, parent, depth, color, branch){
  n.id = idn++; n.parent = parent; n.depth = depth; n.open = false; n.vis = false;
  n.color = n.color ? css(n.color) : (color || "#ffffff");
  n.branch = depth===1 ? n.t : branch;
  n.kids = n.c || [];
  n.r = depth===0 ? 58 : depth===1 ? 42 : 27;
  all.push(n);
  n.kids.forEach(k => prep(k, n, depth+1, n.color, n.branch));
  n.w = Math.max(1, n.kids.reduce((s,k)=>s+k.w,0));
  if (depth === 1) n.w = Math.max(n.w, 3.5);
}
prep(DATA, null, 0, null, null);

// posiciones "hogar": la física las respeta suavemente para que el mapa conserve su orden
const FIRST = 250, RING = 175;
function place(n, a0, a1){
  const a = (a0+a1)/2, r = n.depth===0 ? 0 : FIRST + (n.depth-1)*RING;
  n.hx = Math.cos(a)*r*1.7; n.hy = Math.sin(a)*r*.82;   // elipse: aprovecha pantallas anchas
  let cur = a0; const span = a1-a0, tot = n.kids.reduce((s,k)=>s+k.w,0);
  n.kids.forEach(k => { const s = span*k.w/tot; place(k, cur, cur+s); cur += s; });
}
const w1 = DATA.kids.reduce((s,k)=>s+k.w,0), bottom = 2*Math.PI*DATA.kids[0].w/w1, a0 = Math.PI/2 - bottom/2;
place(DATA, a0, a0 + 2*Math.PI);

/* ---------- Escena ---------- */
const svg = d3.select("#graph"), vp = d3.select("#vp"), gL = d3.select("#links"), gN = d3.select("#nodes");
const card = document.getElementById("card"), hint = document.getElementById("hint"), stageEl = document.getElementById("stage");
let W = innerWidth, H = innerHeight, T = d3.zoomIdentity, pinned = null, hovered = null;

const sim = d3.forceSimulation([])
  .force("link",   d3.forceLink([]).distance(d => d.target.depth===1 ? 190 : 120).strength(.55))
  .force("charge", d3.forceManyBody().strength(d => d.depth===0 ? -300 : d.depth===1 ? -220 : -120).distanceMax(380))
  .force("collide",d3.forceCollide(d => d.r + 38).strength(.9))
  .force("x", d3.forceX(d => d.hx).strength(.11))
  .force("y", d3.forceY(d => d.hy).strength(.11))
  .velocityDecay(.38).alphaDecay(.03).alphaTarget(.012)
  .on("tick", tick);

let linkSel = gL.selectAll("line"), nodeSel = gN.selectAll("g");
function tick(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}

function wrap(s, max){
  const out=[]; let line="";
  s.split(" ").forEach(w=>{ if((line+" "+w).trim().length>max && line){ out.push(line); line=w; } else line=(line+" "+w).trim(); });
  out.push(line); return out;
}
function drawIcon(g, n){
  const def = lucide.icons[n.i]; if(!def) return;
  const s = (n.r*0.95)/24;
  const grp = d3.select(g).attr("transform",`translate(${-12*s},${-12*s}) scale(${s})`);
  def[2].forEach(([tag, attrs]) => { const e = grp.append(tag); Object.entries(attrs).forEach(([k,v])=>e.attr(k,v)); });
}
function build(enter){
  const g = enter.append("g")
    .attr("class", d=>`node d${Math.min(d.depth,2)}${d.kids.length?" has":""}${d.open?" open":""}`)
    .style("--c", d=>d.color)
    .attr("transform", d=>`translate(${d.x},${d.y})`)
    .on("click", onClick).on("mouseenter", onEnter).on("mouseleave", onLeave)
    .call(d3.drag().clickDistance(5)
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; stageEl.classList.add("drag"); })
      .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",  (e,d)=>{ if(!e.active) sim.alphaTarget(.012); if(d.depth>0){ d.fx=null; d.fy=null; } stageEl.classList.remove("drag"); }));
  const body = g.append("g").attr("class","body"), hov = body.append("g").attr("class","hov");
  hov.filter(d=>d.kids.length).append("circle").attr("class","ping").attr("r",d=>d.r);
  hov.append("circle").attr("class","disc").attr("r",d=>d.r);
  hov.append("g").attr("class","ico").each(function(d){ drawIcon(this,d); });
  const bd = hov.filter(d=>d.kids.length).append("g").attr("class","badge").attr("transform",d=>`translate(${d.r*.72},${d.r*.72})`);
  bd.append("circle").attr("r",11); bd.append("text").text(d=>d.kids.length);
  g.append("text").attr("class","lbl").each(function(d){
    const lines = wrap(d.s || d.t, d.depth===0 ? 16 : d.depth===1 ? 17 : 19), t = d3.select(this);
    lines.forEach((ln,i)=> t.append("tspan").attr("x",0).attr("y", d.r + 20 + i*(d.depth<2?17:15)).text(ln));
  });
  return g;
}
function render(){
  const vn = all.filter(n=>n.vis);
  const vl = vn.filter(n=>n.parent).map(n=>({source:n.parent, target:n}));
  sim.nodes(vn); sim.force("link").links(vl);
  linkSel = gL.selectAll("line.link").data(vl, d=>d.target.id).join(
    e=>e.append("line").attr("class","link").style("--c",d=>d.target.color),
    u=>u, x=>x.remove());
  nodeSel = gN.selectAll("g.node").data(vn, d=>d.id).join(build, u=>u, x=>x.remove());
  nodeSel.classed("open", d=>d.open);
  nodeSel.select(".badge text").text(d=>d.open ? "−" : d.kids.length);
  highlight(hovered || null);
  sim.alpha(.85).restart(); tick();
}

/* ---------- Mostrar / ocultar ---------- */
function show(n){ if(n.vis) return; const p=n.parent; n.x=p.x+(Math.random()-.5)*8; n.y=p.y+(Math.random()-.5)*8; n.vx=n.vy=0; n.vis=true; }
function hide(n){ n.vis=false; n.open=false; if(n.depth>0){ n.fx=n.fy=null; } n.kids.forEach(hide); }
function expand(n){ n.open=true; n.kids.forEach(show); }
function collapse(n){ n.open=false; n.kids.forEach(hide); }
function onClick(e,n){
  e.stopPropagation(); pinned=n; showCard(n);
  if(!n.kids.length) { bump(n); return; }
  n.open ? collapse(n) : expand(n);
  hint.classList.add("hide"); render(); settleFit();
}
function bump(n){ nodeSel.filter(d=>d===n).classed("flash",false); void 0; nodeSel.filter(d=>d===n).classed("flash",true); setTimeout(()=>nodeSel.classed("flash",false),2100); }
function expandAll(){ all.forEach(n=>{ if(n.kids.length){ n.open=true; n.kids.forEach(show); } }); hint.classList.add("hide"); render(); settleFit(true); }
function reset(){ collapse(DATA); pinned=null; card.classList.remove("show"); hint.classList.remove("hide"); render(); toCenter(); }

/* ---------- Resaltado por linaje ---------- */
function lineage(n){
  const s = new Set(); for(let p=n;p;p=p.parent) s.add(p);
  (function down(m){ m.kids.forEach(k=>{ if(k.vis){ s.add(k); down(k); } }); })(n);
  return s;
}
function highlight(n){
  if(!n){ nodeSel.classed("dim",false); linkSel.classed("hot",false).classed("dim",false); return; }
  const s = lineage(n);
  nodeSel.classed("dim", d=>!s.has(d));
  linkSel.classed("hot", l=>s.has(l.source)&&s.has(l.target)).classed("dim", l=>!(s.has(l.source)&&s.has(l.target)));
}
function onEnter(e,n){ hovered=n; highlight(n); showCard(n); }
function onLeave(){ hovered=null; highlight(null); if(pinned) showCard(pinned); else card.classList.remove("show"); }

function showCard(n){
  card.style.setProperty("--c", n.color);
  card.querySelector(".tag").textContent = n.depth===0 ? "Fenómeno central" : n.branch;
  card.querySelector("h2").textContent = n.t;
  const trail=[]; for(let p=n.parent;p;p=p.parent) trail.push(p.t);
  card.querySelector(".path").innerHTML = trail.length ? "<b>Se origina en:</b> "+trail.join(" ← ") : "Todo el mapa parte de este fenómeno territorial.";
  card.querySelector(".more").textContent = n.kids.length ? (n.open?"Clic para cerrar · ":"Clic para abrir · ")+n.kids.length+(n.kids.length>1?" causas":" causa") : "Sin más causas registradas";
  card.classList.add("show");
}
svg.on("click", ()=>{ pinned=null; card.classList.remove("show"); });

/* ---------- Cámara ---------- */
const zoom = d3.zoom().scaleExtent([.15,3]).clickDistance(5)
  .on("zoom", e=>{ T=e.transform; vp.attr("transform",T); })
  .on("start", e=>{ if(e.sourceEvent && e.sourceEvent.type==="mousedown") stageEl.classList.add("drag"); })
  .on("end", ()=>stageEl.classList.remove("drag"));
svg.call(zoom).on("dblclick.zoom",null);
function toCenter(){ svg.transition().duration(900).ease(d3.easeCubicOut).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2-20)); }
function bounds(){
  const v = all.filter(n=>n.vis); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  v.forEach(n=>{ x0=Math.min(x0,n.x-80); x1=Math.max(x1,n.x+80); y0=Math.min(y0,n.y-n.r-10); y1=Math.max(y1,n.y+n.r+80); });
  return {x0,y0,x1,y1};
}
function fit(force){
  const b = bounds(), bw=b.x1-b.x0, bh=b.y1-b.y0, padX=60, top=110, bot=90;
  const k = Math.min((W-padX*2)/bw, (H-top-bot)/bh, 1.15);
  const tl = T.apply([b.x0,b.y0]), br = T.apply([b.x1,b.y1]);
  const inside = tl[0]>=padX/2 && br[0]<=W-padX/2 && tl[1]>=top/2 && br[1]<=H-bot/2;
  if(!force && inside) return;
  const kk = force ? k : Math.min(k, T.k);
  const t = d3.zoomIdentity.translate(W/2-(b.x0+bw/2)*kk, top+(H-top-bot)/2-(b.y0+bh/2)*kk).scale(kk);
  svg.transition().duration(1000).ease(d3.easeCubicInOut).call(zoom.transform, t);
}
function settleFit(force){ setTimeout(()=>fit(force),700); setTimeout(()=>fit(force),1700); }
function focusOn(n){
  const k = Math.max(T.k, .95);
  svg.transition().duration(1000).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity.translate(W/2-n.x*k, H/2-n.y*k).scale(k));
}
document.getElementById("bExpand").onclick = expandAll;
document.getElementById("bReset").onclick  = reset;
document.getElementById("bFit").onclick    = ()=>fit(true);
document.getElementById("bIn").onclick     = ()=>svg.transition().duration(300).call(zoom.scaleBy,1.35);
document.getElementById("bOut").onclick    = ()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.35);
addEventListener("resize", ()=>{ W=innerWidth; H=innerHeight; });

/* ---------- Buscador ---------- */
const q = document.getElementById("q"), res = document.getElementById("res");
let hits=[], act=-1;
function reveal(n){
  const chain=[]; for(let p=n.parent;p;p=p.parent) chain.unshift(p);
  chain.forEach(p=>{ if(!p.open) expand(p); });
  hint.classList.add("hide"); render(); pinned=n; showCard(n);
  setTimeout(()=>{ focusOn(n); bump(n); }, 900);
}
function runSearch(){
  const t = norm(q.value.trim()); hits = t ? all.filter(n=>n.depth>0 && norm(n.t).includes(t)).slice(0,7) : [];
  res.innerHTML=""; act=-1;
  hits.forEach((n,i)=>{ const d=document.createElement("div"); d.style.setProperty("--c",n.color); d.textContent=n.t;
    d.onmousedown=e=>{ e.preventDefault(); pick(n); }; res.appendChild(d); });
  res.classList.toggle("show", hits.length>0);
}
function pick(n){ q.value=""; res.classList.remove("show"); q.blur(); reveal(n); }
q.addEventListener("input", runSearch);
q.addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; [...res.children].forEach((c,i)=>c.classList.toggle("act",i===act)); }
  else if(e.key==="Enter" && hits.length){ pick(hits[Math.max(0,act)]); }
  else if(e.key==="Escape"){ q.value=""; runSearch(); q.blur(); }
});
q.addEventListener("blur", ()=>setTimeout(()=>res.classList.remove("show"),150));

/* ---------- Inicio: solo la esfera central ---------- */
DATA.x=0; DATA.y=0; DATA.fx=0; DATA.fy=0; DATA.vis=true;
svg.call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2-20));
render();
if (location.hash === "#todo") expandAll();
</script>
