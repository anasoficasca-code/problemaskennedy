<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Problemáticas de Kennedy · Red causal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --line:#252525; --line2:#383838; --fg:#f0f0f0; --mut:#8e8e8e; --dim:#5d5d5d;
    --g1:#ff6b4a; --g2:#f5c431; --g3:#38cdf0;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  svg{display:block}
  button{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;background:#0a0a0a;color:var(--fg);
    border:1px solid var(--line2);border-radius:10px;font:500 13px var(--sans);cursor:pointer;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
  .btn:hover{background:#171717;border-color:#7d7d7d}
  .btn:active{transform:scale(.97)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pri{background:#f4f4f4;color:#000;border-color:#f4f4f4}.btn.pri:hover{background:#fff}

  /* ---------- lienzo ---------- */
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;background:radial-gradient(ellipse 80% 70% at 50% 50%,#0b0b10 0%,#000 75%)}
  #stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#1c1c1c 1px,transparent 1.1px);background-size:26px 26px;pointer-events:none}
  #stage.drag{cursor:grabbing}
  #graph{position:absolute;inset:0;width:100%;height:100%}

  .eb{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;opacity:0;transition:opacity .5s var(--dl,0s)}
  .ef{fill:none;stroke:var(--c);stroke-width:3;stroke-dasharray:1.5 13;stroke-linecap:round;opacity:0;transition:opacity .5s var(--dl,0s);animation:flow 1.1s linear infinite}
  .edge.on .eb{opacity:.62}.edge.on .ef{opacity:1}
  .edge.cross .eb{stroke-width:2.8;opacity:.75}
  .edge.u .ef{display:none}
  .edge.u .eb{stroke-dasharray:none}
  @keyframes flow{to{stroke-dashoffset:-14.5}}
  .et{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:.14 1.5;stroke-dashoffset:.14;opacity:0;filter:drop-shadow(0 0 5px var(--c))}
  .et.go{opacity:1;animation:trav .8s cubic-bezier(.4,0,.6,1) forwards}
  .et.go.rev{animation-name:travr}
  @keyframes trav{from{stroke-dashoffset:.14}to{stroke-dashoffset:-1}}
  @keyframes travr{from{stroke-dashoffset:-1}to{stroke-dashoffset:.14}}
  .edge{transition:opacity .25s}
  .edge.dim{opacity:.07}

  .node{cursor:pointer;transition:opacity .25s}
  .node.dim{opacity:.13}
  .body{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.2);pointer-events:none;
    transition:transform .7s cubic-bezier(.2,1.3,.35,1) var(--dl,0s),opacity .35s var(--dl,0s)}
  .node.on .body{opacity:1;transform:scale(1);pointer-events:auto}
  .node .lblw{opacity:0;transition:opacity .4s calc(var(--dl,0s) + .2s)}
  .node.on .lblw{opacity:1}
  .hov{transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
  .node:hover .hov{transform:scale(1.12)}
  .disc{fill:url(#discg);stroke:none}
  .ring{fill:none;stroke-width:3.2}
  .node.hub .disc{fill:var(--c)}
  .node.root .disc{fill:#ff5a5f}
  .ico{fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .node.hub .ico{stroke:#0a0a0a;stroke-width:1.8}.node.root .ico{stroke:#0a0a0a;stroke-width:1.6}
  .halo{fill:none;stroke:var(--c);stroke-width:1.6;transform-box:fill-box;transform-origin:center;opacity:0;pointer-events:none}
  .node.more .halo{animation:halo 2.2s ease-out infinite}
  @keyframes halo{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
  .node.sel .ring{stroke-width:5}
  .node.sel .selr{opacity:1}
  .selr{fill:none;stroke:#fff;stroke-width:2;opacity:0;transition:opacity .2s}
  .node.ping .pg{animation:pg .9s ease-out}
  .pg{fill:none;stroke:var(--c);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
  @keyframes pg{0%{transform:scale(1);opacity:.9}100%{transform:scale(2);opacity:0}}
  .badge circle{fill:#000;stroke:var(--c);stroke-width:1.6}
  .badge text{fill:#fff;font:500 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .node.hub .badge circle,.node.root .badge circle{fill:#0a0a0a;stroke:#fff}
  .node.root .ico{stroke:#0a0a0a}
  .lbl{font:500 12.5px var(--sans);fill:#e8e8e8;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:4.5px;stroke-linejoin:round}
  .node.hub .lbl{font:700 14px var(--sans);fill:#fff}
  .node.root .lbl{font:700 15px var(--sans);fill:#fff}
  .node.loose .ring{stroke-dasharray:4 5}

  /* ---------- barra ---------- */
  #bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(#000 55%,rgba(0,0,0,0));pointer-events:none}
  #bar>*{pointer-events:auto}
  #brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
  .logo{flex:none;width:40px;height:40px;border-radius:11px;background:#f4f4f4;color:#000;display:grid;place-items:center}
  .logo svg{width:23px;height:23px}
  #brand h1{font:700 17px var(--sans);letter-spacing:-.1px;white-space:nowrap}
  #brand p{font:400 10px var(--mono);letter-spacing:1.5px;color:var(--mut);margin-top:3px;text-transform:uppercase}
  .search{position:relative;width:290px}
  .search input{width:100%;height:38px;background:#0a0a0a;color:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px 0 38px;font:400 14px var(--sans);outline:none;-webkit-user-select:text;user-select:text}
  .search input:focus{border-color:#9a9a9a}
  .search input::placeholder{color:#666}
  .search>svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:#777}
  #res{position:absolute;left:0;right:0;top:44px;background:#0a0a0a;border:1px solid var(--line2);border-radius:10px;display:none;max-height:320px;overflow:auto;z-index:30}
  #res.show{display:block}
  #res div{padding:10px 12px;font:400 13px/1.3 var(--sans);cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #151515}
  #res div:last-child{border:0}
  #res div:hover,#res div.act{background:#171717}
  .ri{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#000)}
  .ri svg{width:15px;height:15px}
  #bSearch{display:none}
  #gchips{display:none}

  #hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;align-items:center;gap:10px;
    font:500 11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--fg);padding:11px 16px;border:1px solid var(--line2);border-radius:30px;background:#050505;
    animation:hb 2s ease-in-out infinite;transition:opacity .4s;white-space:nowrap;max-width:92vw}
  #hint svg{width:16px;height:16px;flex:none}
  #hint.hide{opacity:0}
  @keyframes hb{50%{transform:translate(-50%,-6px)}}

  #legend{position:fixed;left:20px;bottom:20px;z-index:15;width:290px;display:flex;flex-direction:column;gap:3px;padding:12px;background:rgba(6,6,6,.94);border:1px solid var(--line);border-radius:14px}
  #legend h4{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:4px 4px 5px}
  #legend h4 svg{width:13px;height:13px}
  #legend h4:not(:first-child){margin-top:10px}
  .li{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:9px;font:400 12.5px var(--sans);color:#d0d0d0;cursor:pointer;transition:background .15s}
  .li:hover,.li.act{background:#171717}
  .li.act{outline:1px solid var(--c)}
  .li i{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#0a0a0a;background:var(--c)}
  .li i svg{width:16px;height:16px}
  .li b{margin-left:auto;padding-left:10px;font:500 11px var(--mono);color:var(--mut)}
  .key{display:flex;align-items:center;gap:10px;padding:3px 6px;font:400 12px var(--sans);color:#b8b8b8}
  .key svg{flex:none;width:34px;height:14px;overflow:visible}
  #stat{display:flex;gap:8px;margin:8px 2px 2px}
  #stat div{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#0b0b0b}
  #stat b{display:block;font:500 15px var(--mono);color:#fff}
  #stat span{font:400 10px var(--sans);color:var(--mut)}
  #zoom{position:fixed;right:20px;bottom:20px;z-index:15;display:flex;flex-direction:column;gap:6px}
  #zoom .btn{width:38px;padding:0}

  /* ---------- inspector ---------- */
  #insp{position:fixed;right:20px;top:76px;width:330px;max-height:calc(100vh - 160px);overflow:auto;z-index:18;padding:18px;background:#080808;border:1px solid var(--line2);border-radius:16px;
    opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s;user-select:text;-webkit-user-select:text}
  #insp.show{opacity:1;transform:none;pointer-events:auto}
  #iClose{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:9px;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center}
  #iClose:hover{background:#171717;color:#fff}#iClose svg{width:16px;height:16px}
  .ih{display:flex;align-items:center;gap:13px;padding-right:26px}
  .ih .it{flex:none;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#0a0a0a;background:var(--c)}
  .ih .it svg{width:30px;height:30px}
  .ih .ic{font:500 10.5px var(--mono);letter-spacing:1.2px;color:var(--mut);text-transform:uppercase}
  .ih h2{font:700 17px/1.22 var(--sans);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:20px;font:500 11.5px var(--sans);color:#ddd;border:1px solid color-mix(in srgb,var(--c) 50%,#000);background:color-mix(in srgb,var(--c) 10%,#000)}
  .chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0a0a}.chip i svg{width:11px;height:11px}
  .isec{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:18px 0 8px}
  .isec svg{width:13px;height:13px}.isec b{margin-left:auto;color:var(--mut)}
  .rel{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;font:400 12.5px/1.25 var(--sans);color:#d4d4d4;transition:background .15s}
  .rel:hover{background:#151515}
  .rel .ri{width:30px;height:30px;border-radius:9px}
  .rel .ri svg{width:17px;height:17px}
  .rel small{margin-left:auto;font:400 10px var(--mono);color:var(--dim);flex:none}
  .rel.hid{opacity:.55}
  .istats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .istats div{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0c0c0c}
  .istats svg{width:15px;height:15px;color:var(--c);margin-bottom:6px}
  .istats b{display:block;font:500 20px var(--mono);color:#fff}
  .istats span{font:400 10.5px var(--sans);color:var(--mut)}
  .iact{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .iact .btn{flex:1;padding:0 10px}
  #mbar{display:none}

  /* ---------- tablet ---------- */
  @media (max-width:1100px){
    #brand p{display:none} .search{width:220px}
    #legend{width:auto;padding:8px} #legend .li span,#legend h4,#legend .key,#legend b,#stat{display:none}
    #insp{width:300px}
  }
  /* ---------- móvil ---------- */
  @media (max-width:760px){
    #bar{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:8px;flex-wrap:wrap;background:linear-gradient(#000 70%,rgba(0,0,0,0))}
    #brand h1{font-size:15px} .logo{width:36px;height:36px}
    #bSearch{display:inline-flex;width:38px;padding:0}
    .search{display:none;order:5;width:100%}
    .search.show{display:block}
    #bProp,#bAll,#bReset{display:none}
    #gchips{display:flex;order:6;width:100%;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
    #gchips::-webkit-scrollbar{display:none}
    .gch{flex:none;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:30px;border:1px solid color-mix(in srgb,var(--c) 45%,#000);background:color-mix(in srgb,var(--c) 10%,#000);color:#e6e6e6;font:500 12px var(--sans);cursor:pointer}
    .gch.act{background:color-mix(in srgb,var(--c) 28%,#000);border-color:var(--c)}
    .gch i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0a0a}.gch i svg{width:14px;height:14px}
    #hint{bottom:calc(92px + env(safe-area-inset-bottom));font-size:10px;padding:9px 12px;white-space:normal;text-align:center;width:max-content;max-width:88vw}
    #zoom{display:none}
    #legend{display:none;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));width:auto;max-height:55vh;overflow:auto;z-index:40;padding:14px}
    #legend.open{display:flex} #legend .li span,#legend h4,#legend .key,#legend b,#stat{display:flex} #legend .li span{display:inline} #legend b{display:inline}
    #mbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 38%)}
    #mbar .btn{flex:1;flex-direction:column;gap:3px;height:54px;border-radius:13px;font-size:11px;padding:0 4px}
    #mbar .btn svg{width:19px;height:19px}
    #insp{left:0;right:0;top:auto;bottom:0;width:auto;max-height:64vh;border-radius:22px 22px 0 0;border-width:1px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);z-index:45}
    #insp.show{transform:none}
    #insp::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:#333;margin:-10px auto 14px}
    #iClose{top:14px}
  }
</style>
</head>
<body>
<div id="stage"><svg id="graph"><defs id="defs"></defs><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg></div>

<div id="bar">
  <div id="brand"><div class="logo" id="logo"></div><div><h1>Problemáticas de Kennedy</h1><p>Modelamiento dinámico · red causal</p></div></div>
  <button class="btn" id="bSearch" aria-label="Buscar"></button>
  <div class="search" id="dsearch"></div>
  <button class="btn pri" id="bProp"></button>
  <button class="btn" id="bAll"></button>
  <button class="btn" id="bReset"></button>
  <div id="gchips"></div>
</div>
<div id="hint"></div>
<div id="legend"></div>
<div id="zoom"><button class="btn" id="bIn"></button><button class="btn" id="bOut"></button><button class="btn" id="bFit"></button></div>
<div id="insp"><button id="iClose" aria-label="Cerrar"></button><div id="ibody"></div></div>
<div id="mbar"><button class="btn pri" id="mP"></button><button class="btn" id="mAll"></button><button class="btn" id="mReset"></button><button class="btn" id="mLeg"></button></div>

<script src="lib/d3.min.js"></script>
<script src="lib/lucide.min.js"></script>
<script>

   DATOS: 41 variables y 49 conexiones tal como están en el tablero de Miro
   (posición x,y del tablero · tipo de flecha de cada conector)

];
// [origen, destino, tipo]  d = flecha de origen → destino · u = línea sin flecha (relación)
const ED = [

 ["trans","no2","d"],["no2","aire","d"],["aire","eco","d"],["calagua","eco","d"],["plan","supcons","u"],["supcons","suelo","u"],["supcons","imperm","u"],["suelo","lluvia","u"],

 ["exp","crec","d"],["epi","hig","d"],["desc","epi","d"],["supcons","frag","u"],["frag","perdveg","u"],["frag","hab","u"],["perdveg","hab","u"],["hab","biodiv","u"],["biodiv","eco","u"]

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
function icon(name, sw=1.7){
  const d = lucide.icons[name]; if(!d) return "";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d[2].map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`).join("")}</svg>`;
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const isMobile = () => matchMedia("(max-width:760px)").matches;
const SC = .98;   // escala de las posiciones del tablero

/* ============ construcción del grafo ============ */
const nodes = ND.map((d,i)=>({ id:i, key:d[0], t:d[1], s:d[2]||d[1], i:d[3], g:d[4], mx:d[5], my:d[6], vis:false, open:false, by:null, nei:[], inn:[], out:[], und:[], extra:[], groups:[d[4]] }));
const K = Object.fromEntries(nodes.map(n=>[n.key,n]));
const edges = ED.map((d,i)=>({ id:i, s:K[d[0]], t:K[d[1]], dir:d[2]==="d", curv:.09*(i%2?1:-1) }));
const root = K.root; const HUBS = ["may","res","eco"].map(k=>K[k]);
edges.forEach(e=>{
  e.cross = !!(e.s.g && e.t.g && e.s.g!==e.t.g);
  e.color = e.cross ? "#ffffff" : (e.s.g===0 ? G[e.t.g].color : G[e.s.g].color);
  e.s.nei.push({n:e.t,e}); e.t.nei.push({n:e.s,e});
  if(e.dir){ e.s.out.push({n:e.t,e}); e.t.inn.push({n:e.s,e}); } else { e.s.und.push({n:e.t,e}); e.t.und.push({n:e.s,e}); }
  if(e.cross){ if(!e.s.groups.includes(e.t.g)) e.s.groups.push(e.t.g); if(!e.t.groups.includes(e.s.g)) e.t.groups.push(e.s.g); }
});
K.infra.extra.push(K.mono); K.mono.loose=true;           // la monoexportación no tiene conectores en el tablero: aparece junto a su vecina
nodes.forEach(n=>{
  n.r = n===root?62 : HUBS.includes(n)?46 : n.loose?27 : 31;
  n.color = n.g? G[n.g].color : "#ff5a5f";
  n.bridge = n.groups.length>1; n.hub = HUBS.includes(n);
  n.lines = wrap(n.s, n===root?18:n.hub?16:15);
  n.sp = .5+Math.random()*.7; n.ph = Math.random()*6.28;
});
function wrap(s,max){ const o=[]; let l=""; s.split(" ").forEach(w=>{ if((l+" "+w).trim().length>max&&l){ o.push(l); l=w; } else l=(l+" "+w).trim(); }); o.push(l); return o; }
// posiciones "hogar" = posiciones del tablero de Miro, centradas en el fenómeno
nodes.forEach(n=>{ n.hx=(n.mx-root.mx)*SC; n.hy=(n.my-root.my)*SC; n.x=n.hx; n.y=n.hy; n.px=n.x; n.py=n.y; });
const hiddenCount = n => n.nei.filter(o=>!o.n.vis).length + n.extra.filter(m=>!m.vis).length;

defs.insertAdjacentHTML("beforeend",`<radialGradient id="discg" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#0a0a0a"/></radialGradient>`);

edges.forEach(e=>{
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","edge"+(e.cross?" cross":"")+(e.dir?"":" u")); g.style.setProperty("--c",e.color);

  e.eb=mk("eb"); e.ef=mk("ef"); e.ef.removeAttribute("pathLength"); e.et=mk("et");

const NG=d3.select("#nodes");
nodes.forEach(n=>{

  const sq=(cls,r,extra="")=>`<rect class="${cls}" x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" rx="${(r*.42).toFixed(1)}" ${extra}/>`;
  const body=`<g class="body"><g class="hov">
      ${sq("halo",n.r+8)}${sq("pg",n.r)}

      ${n.hub&&n.bridge?sq("ring",n.r,`stroke="${ringStroke}"`):""}
      ${sq("selr",n.r+7)}
      <g class="ico" transform="translate(${-12*s*0.9},${-12*s*0.9}) scale(${s*0.9})">${ic?ic[2].map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`).join(""):""}</g>
      <g class="badge" transform="translate(${n.r*.78},${-n.r*.78})"><circle r="11"/><text></text></g>

  g.innerHTML=body; n.el=g; n.badge=g.querySelector(".badge"); n.badgeT=g.querySelector(".badge text");
  $("#nodes").appendChild(g);
  g.addEventListener("click",ev=>{ ev.stopPropagation(); if(dragged) return; onNode(n); });
  g.addEventListener("mouseenter",()=>{ if(!isMobile()) hoverFocus(n); }); g.addEventListener("mouseleave",()=>{ hoverFocus(null); });
  g.querySelector("title")||g.insertAdjacentHTML("afterbegin",`<title>${n.t}</title>`);
});

/* ============ física suave (resortes hacia la posición del tablero) ============ */
let dragged=false;
const sim=d3.forceSimulation(nodes).force("x",d3.forceX(d=>d.hx).strength(.11)).force("y",d3.forceY(d=>d.hy).strength(.11))
  .force("col",d3.forceCollide(d=>d.r+8).strength(.6)).velocityDecay(.34).alphaDecay(.02).alphaTarget(.012).on("tick",tick);
nodes.forEach(n=>{ n.fx=null; n.fy=null; });
d3.select("#nodes").selectAll("g.node").data(nodes).call(d3.drag().clickDistance(5)
  .on("start",(e,d)=>{ dragged=false; if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
  .on("drag",(e,d)=>{ dragged=true; d.fx=e.x; d.fy=e.y; })
  .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(.012); d.fx=null; d.fy=null; setTimeout(()=>dragged=false,0); }));
function edgePath(e){
  const s=e.s,t=e.t, dx=t.px-s.px, dy=t.py-s.py, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
  const a=[s.px+ux*(s.r+4), s.py+uy*(s.r+4)], off=t.r+(e.dir?9:4), b=[t.px-ux*off, t.py-uy*off], k=e.curv*d;
  return `M${a[0].toFixed(1)} ${a[1].toFixed(1)}Q${((a[0]+b[0])/2-uy*k).toFixed(1)} ${((a[1]+b[1])/2+ux*k).toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
}
function tick(){
  const tm=performance.now()/1000;
  nodes.forEach(n=>{ n.px=n.x+Math.sin(tm*n.sp+n.ph)*2.2; n.py=n.y+Math.cos(tm*n.sp*.9+n.ph)*2.2; n.el.setAttribute("transform",`translate(${n.px.toFixed(1)},${n.py.toFixed(1)})`); });
  edges.forEach(e=>{ if(!e.show) return; const d=edgePath(e); e.eb.setAttribute("d",d); e.ef.setAttribute("d",d); e.et.setAttribute("d",d); });
}

/* =====================================================================
   VISIBILIDAD: se descubre la red nodo a nodo (vecinos del nodo tocado)
   ===================================================================== */
let sel=null, gfocus=0;
function showNode(n,origin,dl){ if(n.vis) return; n.vis=true; n.by=origin||null; if(origin){ n.x=origin.x; n.y=origin.y; n.vx=0; n.vy=0; } n.el.style.setProperty("--dl",dl+"s"); }
function discover(n){
  let i=0; const added=[];
  n.nei.forEach(o=>{ if(!o.n.vis){ showNode(o.n,n,i++*.07); added.push(o.n); } });
  n.extra.forEach(m=>{ if(!m.vis){ showNode(m,n,i++*.07); added.push(m); } });
  n.open=true; return added;
}
function undiscover(n){ // oculta lo que este nodo descubrió (y lo que esos descubrieron)
  nodes.filter(m=>m.by===n&&m.vis).forEach(m=>{ m.vis=false; m.by=null; m.open=false; undiscover(m); });
  n.open=false;
}
function refresh(){
  nodes.forEach(n=>{
    n.el.classList.toggle("on",n.vis); n.el.classList.toggle("sel",n===sel);
    const h=hiddenCount(n); n.el.classList.toggle("more",n.vis&&h>0);
    n.badge.style.display = n.vis&&h>0 ? "" : "none"; n.badgeT.textContent=h;
  });
  let ve=0; edges.forEach(e=>{ const on=e.s.vis&&e.t.vis; e.show=on; if(on) ve++; e.g.classList.toggle("on",on); e.g.style.setProperty("--dl",(Math.max(e.s.vis?0:0,0)+.25)+"s"); });
  $("#sN").textContent=nodes.filter(n=>n.vis).length+"/"+nodes.length; $("#sE").textContent=ve+"/"+edges.length;
  sim.alpha(.7).restart(); tick(); renderInsp();
}
function onNode(n){
  hideHints(); select(n);
  const hid=hiddenCount(n);
  if(hid>0){ const added=discover(n); refresh(); focusCam([n,...added]); }
  else if(nodes.some(m=>m.by===n&&m.vis)){ undiscover(n); refresh(); }
  else { refresh(); ping(n); }
}
function expandAll(){ nodes.forEach(n=>{ if(!n.vis){ showNode(n,root,Math.random()*.5); } n.open=true; }); hideHints(); refresh(); setTimeout(()=>fit(),50); }
function reset(){ nodes.forEach(n=>{ n.vis=(n===root); n.by=null; n.open=false; n.x=n.hx; n.y=n.hy; }); sel=null; gfocus=0; legendFocus(); closeInsp(); $("#hint").classList.remove("hide"); refresh(); home(); }
function hideHints(){ $("#hint").classList.add("hide"); }
function ensureVisible(n){ // muestra el camino más corto desde lo visible hasta n
  if(n.vis) return;
  const prev=new Map(), q=nodes.filter(m=>m.vis); const seen=new Set(q); let found=null;
  while(q.length&&!found){ const c=q.shift(); for(const o of c.nei){ if(!seen.has(o.n)){ seen.add(o.n); prev.set(o.n,c); if(o.n===n){ found=o.n; break; } q.push(o.n); } } }
  let cur=n; if(!found){ showNode(n,root,0); return; }
  const chain=[]; while(cur&&!cur.vis){ chain.unshift(cur); cur=prev.get(cur); }
  chain.forEach((m,i)=>showNode(m,prev.get(m),i*.12));
}

/* ============ resaltados ============ */
function hoverFocus(n){
  if(!n){ if(!gfocus){ nodes.forEach(m=>m.el.classList.remove("dim")); edges.forEach(e=>e.g.classList.remove("dim")); } else applyGroup(); return; }
  const s=new Set([n]); n.nei.forEach(o=>{ if(o.n.vis) s.add(o.n); });
  nodes.forEach(m=>m.el.classList.toggle("dim",m.vis&&!s.has(m)));
  edges.forEach(e=>e.g.classList.toggle("dim",!(e.s===n||e.t===n)));
}
function applyGroup(){
  nodes.forEach(m=>m.el.classList.toggle("dim",m.vis&&m!==root&&!m.groups.includes(gfocus)));
  edges.forEach(e=>{ const ok=(e.s===root||e.s.groups.includes(gfocus))&&(e.t===root||e.t.groups.includes(gfocus)); e.g.classList.toggle("dim",!ok); });
}
function legendFocus(){ document.querySelectorAll(".li[data-g],.gch").forEach(l=>l.classList.toggle("act",+l.dataset.g===gfocus&&gfocus>0)); if(gfocus) applyGroup(); else hoverFocus(null); }

const label=n=>n.s;
function relRow(o,kind){ const m=o.n; return `<div class="rel${m.vis?"":" hid"}" data-k="${m.key}" style="--c:${m.color}"><span class="ri">${icon(m.i)}</span><span>${label(m)}</span><small>${m.vis?"":"oculta"}</small></div>`; }

  const sec=(ic,t,arr)=>arr.length?`<div class="isec">${icon(ic,2)}${t}<b>${arr.length}</b></div>${arr.map(o=>relRow(o)).join("")}`:"";

  <div class="istats" style="--c:${n.color}"><div>${icon("ArrowDownToLine",2)}<b>${n.inn.length}</b><span>Entradas</span></div><div>${icon("ArrowUpFromLine",2)}<b>${n.out.length}</b><span>Salidas</span></div><div>${icon("Network",2)}<b>${n.nei.length}</b><span>Conexiones</span></div></div>
  <div class="iact"><button class="btn pri" data-a="prop">${icon("Play",2)}Propagar</button><button class="btn" data-a="center">${icon("Crosshair",2)}Centrar</button></div>`;
}
function renderInsp(){
  const box=$("#insp"); if(!sel){ box.classList.remove("show"); return; }
  $("#ibody").innerHTML=inspHTML(sel);
  $("#ibody").querySelectorAll(".rel").forEach(r=>r.onclick=()=>goNode(K[r.dataset.k]));

  box.classList.add("show");
}
function select(n){ sel=n; nodes.forEach(m=>m.el.classList.toggle("sel",m===n)); renderInsp(); }
function closeInsp(){ $("#insp").classList.remove("show"); }
$("#iClose").onclick=()=>{ sel=null; nodes.forEach(m=>m.el.classList.remove("sel")); closeInsp(); };
stage.addEventListener("click",()=>{ if(!moved){ $("#iClose").onclick(); $("#legend").classList.remove("open"); } });
function goNode(n){ hideHints(); ensureVisible(n); refresh(); select(n); setTimeout(()=>{ focusCam([n],true); ping(n); },420); }

/* ============ propagación a lo largo de las flechas ============ */
let timers=[];
function ping(n){ n.el.classList.remove("ping"); void n.el.getBoundingClientRect(); n.el.classList.add("ping"); setTimeout(()=>n.el.classList.remove("ping"),1000); }
function propagate(start){
  timers.forEach(clearTimeout); timers=[]; nodes.forEach(n=>n.el.classList.remove("ping"));
  const seen=new Set([start]); let front=[start], lv=0; ping(start);
  while(front.length){
    const nxt=[], step=[];
    front.forEach(n=>{
      n.out.forEach(o=>{ if(o.n.vis&&!seen.has(o.n)){ seen.add(o.n); nxt.push(o.n); step.push({e:o.e,rev:false,n:o.n}); } });
      n.und.forEach(o=>{ if(o.n.vis&&!seen.has(o.n)){ seen.add(o.n); nxt.push(o.n); step.push({e:o.e,rev:o.e.t===n,n:o.n}); } });
    });
    if(step.length){ const d=lv*720;
      timers.push(setTimeout(()=>step.forEach(s=>{ s.e.et.classList.remove("go","rev"); void s.e.et.getBoundingClientRect(); s.e.et.classList.add("go"); if(s.rev) s.e.et.classList.add("rev"); }),d));
      timers.push(setTimeout(()=>step.forEach(s=>ping(s.n)),d+640)); }
    front=nxt; lv++;
  }
}
function runProp(){ if(!HUBS[0].vis){ discover(root); refresh(); focusCam([root,...HUBS]); setTimeout(()=>propagate(root),950); } else propagate(sel||root); }
$("#bProp").onclick=runProp; $("#mP").onclick=runProp; $("#bAll").onclick=expandAll; $("#mAll").onclick=expandAll; $("#bReset").onclick=reset; $("#mReset").onclick=reset;

/* ============ cámara ============ */
const DUR=900; let W=innerWidth,H=innerHeight,T=d3.zoomIdentity,moved=false,startT=T;
const zoom=d3.zoom().scaleExtent([.1,2.6]).clickDistance(5)
  .on("start",()=>{ moved=false; })
  .on("zoom",e=>{ T=e.transform; vp.attr("transform",T); if(e.sourceEvent&&e.sourceEvent.type!=="wheel"&&Math.hypot(T.x-startT.x,T.y-startT.y)>4){ moved=true; stage.classList.add("drag"); } })
  .on("end",()=>{ stage.classList.remove("drag"); setTimeout(()=>moved=false,0); });
svg.call(zoom).on("dblclick.zoom",null).on("pointerdown.t",()=>{ startT=T; });
function goto(t,ms=DUR){ svg.transition().duration(ms).ease(d3.easeCubicInOut).call(zoom.transform,t); }
const homeT=()=>d3.zoomIdentity.translate(W/2,H/2+(isMobile()?-10:10)).scale(isMobile()?.8:1);
function home(){ goto(homeT()); }
function box(ns){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; ns.forEach(n=>{ const w=Math.max(n.r+30,70); x0=Math.min(x0,n.hx-w); x1=Math.max(x1,n.hx+w); y0=Math.min(y0,n.hy-n.r-14); y1=Math.max(y1,n.hy+n.r+62); }); return {x0,y0,x1,y1}; }
const pads=()=>isMobile()?{l:14,r:14,t:140,b:110}:{l:60,r:$("#insp").classList.contains("show")&&W>1100?370:70,t:96,b:84};
function fit(ns){ const v=ns||nodes.filter(n=>n.vis), b=box(v), p=pads(); const k=Math.min((W-p.l-p.r)/(b.x1-b.x0),(H-p.t-p.b)/(b.y1-b.y0),1.15);
  goto(d3.zoomIdentity.translate(p.l+(W-p.l-p.r-(b.x1-b.x0)*k)/2-b.x0*k,p.t+(H-p.t-p.b-(b.y1-b.y0)*k)/2-b.y0*k).scale(k)); }
function focusCam(ns,center){ // sin acercar de más: solo ajusta si lo nuevo queda fuera o si piden centrar
  const b=box(ns), p=pads(); let k=T.k; const need=Math.min((W-p.l-p.r)/(b.x1-b.x0),(H-p.t-p.b)/(b.y1-b.y0)); if(need<k) k=Math.max(.2,need);
  if(center){ k=Math.max(k,isMobile()?.85:.95); const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2; goto(d3.zoomIdentity.translate((p.l+W-p.r)/2-cx*k,(p.t+H-p.b)/2-cy*k).scale(k),800); return; }
  let tx=T.x,ty=T.y; const L=b.x0*k+tx,R=b.x1*k+tx,Tp=b.y0*k+ty,B=b.y1*k+ty;
  if(L<p.l) tx+=p.l-L; else if(R>W-p.r) tx-=R-(W-p.r); if(Tp<p.t) ty+=p.t-Tp; else if(B>H-p.b) ty-=B-(H-p.b);
  if(k!==T.k||tx!==T.x||ty!==T.y) goto(d3.zoomIdentity.translate(tx,ty).scale(k),780);
}
$("#bIn").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.35); $("#bOut").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.35); $("#bFit").onclick=()=>fit();
addEventListener("resize",()=>{ W=innerWidth; H=innerHeight; });

/* ============ buscador ============ */
(function(){
  const inp=$("#q"), res=$("#res"); let hits=[], act=-1;
  const run=()=>{ const t=norm(inp.value.trim()); hits=t?nodes.filter(n=>n!==root&&(norm(n.t).includes(t)||norm(n.s).includes(t))).slice(0,7):[]; act=-1; res.innerHTML="";
    hits.forEach(n=>{ const d=document.createElement("div"); d.style.setProperty("--c",n.color); d.innerHTML=`<span class="ri">${icon(n.i)}</span><span>${n.s}</span>`; d.onmousedown=d.ontouchstart=e=>{ e.preventDefault(); pick(n); }; res.appendChild(d); });
    res.classList.toggle("show",hits.length>0); };
  const pick=n=>{ inp.value=""; res.classList.remove("show"); inp.blur(); $("#dsearch").classList.remove("show"); goNode(n); };
  inp.addEventListener("input",run);
  inp.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; [...res.children].forEach((c,i)=>c.classList.toggle("act",i===act)); }
    else if(e.key==="Enter"&&hits.length) pick(hits[Math.max(0,act)]); else if(e.key==="Escape"){ inp.value=""; run(); inp.blur(); } });
  inp.addEventListener("blur",()=>setTimeout(()=>res.classList.remove("show"),180));
})();

/* ============ inicio ============ */
root.vis=true; svg.call(zoom.transform,homeT()); refresh();
const hs=location.hash;
if(hs==="#todo") expandAll();
else if(hs.startsWith("#n=")&&K[hs.slice(3)]) goNode(K[hs.slice(3)]);
</script>
</body>
</html>
