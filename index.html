<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Problemáticas de Kennedy · Red causal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --line:#252525; --line2:#383838; --fg:#f0f0f0; --mut:#8e8e8e; --dim:#5d5d5d;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  svg{display:block}
  button{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;background:rgba(10,10,10,.85);color:var(--fg);
    border:1px solid var(--line2);border-radius:10px;font:500 13px var(--sans);cursor:pointer;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap;backdrop-filter:blur(6px)}
  .btn:hover{background:#171717;border-color:#7d7d7d}
  .btn:active{transform:scale(.97)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pri{background:#f4f4f4;color:#000;border-color:#f4f4f4}.btn.pri:hover{background:#fff}

  /* ---------- lienzo ---------- */
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;background:#000}
  #stage.drag{cursor:grabbing}
  #graph{position:absolute;inset:0;width:100%;height:100%}
  #starfield{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .arc{fill:none;stroke-linecap:round;opacity:.55}
  .guide{fill:none;stroke:#fff;stroke-opacity:.05;stroke-dasharray:2 9}

  .eb{fill:none;stroke-width:2.1;stroke-linecap:round;opacity:0;transition:opacity .6s var(--dl,0s),stroke-width .2s}
  .ef{fill:none;stroke-width:2.6;stroke-dasharray:1.5 12;stroke-linecap:round;opacity:0;transition:opacity .6s var(--dl,0s);animation:flow 1.2s linear infinite}
  .edge.on .eb{opacity:.5}.edge.on .ef{opacity:.9}
  .edge.cross .eb{stroke-width:2.6;opacity:.7}
  .edge.u .ef{display:none}
  @keyframes flow{to{stroke-dashoffset:-13.5}}
  .et{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:.07 1.5;stroke-dashoffset:.07;opacity:0;filter:drop-shadow(0 0 6px #fff)}
  .et.go{opacity:1;animation:trav 1s cubic-bezier(.4,0,.6,1) forwards}
  .et.go.rev{animation-name:travr}
  @keyframes trav{from{stroke-dashoffset:.07}to{stroke-dashoffset:-1}}
  @keyframes travr{from{stroke-dashoffset:-1}to{stroke-dashoffset:.07}}
  .edge{transition:opacity .25s}
  .edge.dim{opacity:.05}
  .edge.hot .eb{opacity:1;stroke-width:3.4}.edge.hot .ef{opacity:1}

  .node{cursor:pointer;transition:opacity .25s}
  .node.dim{opacity:.12}
  .body{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.1);pointer-events:none;
    transition:transform .8s cubic-bezier(.2,1.35,.35,1) var(--dl,0s),opacity .4s var(--dl,0s)}
  .node.on .body{opacity:1;transform:scale(1);pointer-events:auto}
  .node .lblw{opacity:0;transition:opacity .5s calc(var(--dl,0s) + .25s)}
  .node.on .lblw{opacity:1}
  .hov{transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .node:hover .hov{transform:scale(1.14)}
  .glow{pointer-events:none;animation:breathe 4s ease-in-out infinite;animation-delay:var(--bd,0s)}
  @keyframes breathe{50%{opacity:.55}}
  .ring{fill:none;stroke-width:2.2}
  .ico{fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .halo{fill:none;stroke:var(--c);stroke-width:1.6;transform-box:fill-box;transform-origin:center;opacity:0;pointer-events:none}
  .node.more .halo{animation:halo 2.3s ease-out infinite}
  @keyframes halo{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.7);opacity:0}}
  .selr{fill:none;stroke:#fff;stroke-width:2.2;opacity:0;transition:opacity .2s}
  .node.sel .selr{opacity:1}
  .pg{fill:none;stroke:var(--c);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
  .node.ping .pg{animation:pg 1s ease-out}
  @keyframes pg{0%{transform:scale(1);opacity:1}100%{transform:scale(2.4);opacity:0}}
  .badge circle{fill:#000;stroke:var(--c);stroke-width:1.6}
  .badge text{fill:#fff;font:500 11px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lbl{font:400 12.5px var(--sans);fill:#cfcfcf;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:4px;stroke-linejoin:round;dominant-baseline:central;transition:fill .2s}
  .node.hub .lbl{font:600 14px var(--sans);fill:#fff}
  .node:hover .lbl,.node.sel .lbl{fill:#fff}
  .rootl{font:700 15px var(--sans);fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:4px;pointer-events:none}
  .node.loose .ring{stroke-dasharray:3 4}

  /* ---------- barra ---------- */
  #bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(#000 45%,rgba(0,0,0,0));pointer-events:none}
  #bar>*{pointer-events:auto}
  #brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
  .logo{flex:none;width:40px;height:40px;border-radius:12px;background:#f4f4f4;color:#000;display:grid;place-items:center}
  .logo svg{width:23px;height:23px}
  #brand h1{font:600 17px var(--sans);letter-spacing:-.1px;white-space:nowrap}
  #brand p{font:400 10px var(--mono);letter-spacing:1.5px;color:var(--mut);margin-top:3px;text-transform:uppercase}
  .search{position:relative;width:280px}
  .search input{width:100%;height:38px;background:rgba(10,10,10,.85);color:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px 0 38px;font:400 14px var(--sans);outline:none;-webkit-user-select:text;user-select:text}
  .search input:focus{border-color:#9a9a9a}
  .search input::placeholder{color:#666}
  .search>svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:#777}
  #res{position:absolute;left:0;right:0;top:44px;background:#0a0a0a;border:1px solid var(--line2);border-radius:10px;display:none;max-height:320px;overflow:auto;z-index:30}
  #res.show{display:block}
  #res div{padding:10px 12px;font:400 13px/1.3 var(--sans);cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #151515}
  #res div:last-child{border:0}
  #res div:hover,#res div.act{background:#171717}
  .ri{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,#000);border:1px solid color-mix(in srgb,var(--c) 45%,#000)}
  .ri svg{width:15px;height:15px}
  #bSearch{display:none}
  #gchips{display:none}

  #hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;align-items:center;gap:10px;
    font:500 11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--fg);padding:11px 16px;border:1px solid var(--line2);border-radius:30px;background:rgba(5,5,5,.9);
    animation:hb 2s ease-in-out infinite;transition:opacity .4s;white-space:nowrap;max-width:92vw}
  #hint svg{width:16px;height:16px;flex:none}
  #hint.hide{opacity:0}
  @keyframes hb{50%{transform:translate(-50%,-6px)}}

  #legend{position:fixed;left:20px;bottom:20px;z-index:15;width:290px;display:flex;flex-direction:column;gap:3px;padding:12px;background:rgba(6,6,6,.92);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
  #legend h4{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:4px 4px 5px}
  #legend h4 svg{width:13px;height:13px}
  #legend h4:not(:first-child){margin-top:10px}
  .li{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:10px;font:400 12.5px var(--sans);color:#d0d0d0;cursor:pointer;transition:background .15s}
  .li:hover,.li.act{background:#171717}
  .li.act{outline:1px solid var(--c)}
  .li i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent)}
  .li i svg{width:15px;height:15px}
  .li b{margin-left:auto;padding-left:10px;font:500 11px var(--mono);color:var(--mut)}
  .key{display:flex;align-items:center;gap:10px;padding:3px 6px;font:400 12px var(--sans);color:#b8b8b8}
  .key svg{flex:none;width:34px;height:14px;overflow:visible}
  #stat{display:flex;gap:8px;margin:8px 2px 2px}
  #stat div{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#0b0b0b}
  #stat b{display:block;font:500 15px var(--mono);color:#fff}
  #stat span{font:400 10px var(--sans);color:var(--mut)}
  #zoom{position:fixed;right:20px;bottom:20px;z-index:15;display:flex;flex-direction:column;gap:6px}
  #zoom .btn{width:38px;padding:0}

  /* ---------- paneles ---------- */
  #insp{position:fixed;right:20px;top:76px;width:330px;max-height:calc(100vh - 160px);overflow:auto;z-index:18;padding:18px;background:rgba(8,8,8,.96);border:1px solid var(--line2);border-radius:18px;
    opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s;user-select:text;-webkit-user-select:text}
  #insp.show{opacity:1;transform:none;pointer-events:auto}
  #iClose,#cClose{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:9px;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center}
  #iClose:hover,#cClose:hover{background:#171717;color:#fff}#iClose svg,#cClose svg{width:16px;height:16px}
  .ih{display:flex;align-items:center;gap:13px;padding-right:26px}
  .ih .it{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%,var(--c),color-mix(in srgb,var(--c) 40%,#000));box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
  .ih .it svg{width:28px;height:28px}
  .ih .ic{font:500 10.5px var(--mono);letter-spacing:1.2px;color:var(--mut);text-transform:uppercase}
  .ih h2{font:600 17px/1.22 var(--sans);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:20px;font:500 11.5px var(--sans);color:#ddd;border:1px solid color-mix(in srgb,var(--c) 50%,#000);background:color-mix(in srgb,var(--c) 10%,#000)}
  .chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0a0a}.chip i svg{width:11px;height:11px}
  .isec{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:18px 0 8px}
  .isec svg{width:13px;height:13px}.isec b{margin-left:auto;color:var(--mut)}
  .rel{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;font:400 12.5px/1.25 var(--sans);color:#d4d4d4;transition:background .15s}
  .rel:hover{background:#151515}
  .rel .ri{width:30px;height:30px}.rel .ri svg{width:16px;height:16px}
  .rel small{margin-left:auto;font:400 10px var(--mono);color:var(--dim);flex:none}
  .rel.hid{opacity:.55}
  .istats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .istats div{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0c0c0c}
  .istats svg{width:15px;height:15px;color:var(--c);margin-bottom:6px}
  .istats b{display:block;font:500 20px var(--mono);color:#fff}
  .istats span{font:400 10.5px var(--sans);color:var(--mut)}
  .iact{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .iact .btn{flex:1;padding:0 10px}
  #mbar{display:none}

  #ctx{position:fixed;left:20px;top:76px;width:380px;max-height:calc(100vh - 480px);min-height:240px;overflow:auto;z-index:19;padding:20px 20px 18px;background:rgba(8,8,8,.96);border:1px solid var(--line2);border-radius:18px;
    opacity:0;transform:translateX(-12px);pointer-events:none;transition:opacity .25s,transform .25s;user-select:text;-webkit-user-select:text}
  #ctx.show{opacity:1;transform:none;pointer-events:auto}
  #ctx .ch{display:flex;align-items:center;gap:12px;padding-right:28px}
  #ctx .ch i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f4f4f4;color:#000}#ctx .ch i svg{width:23px;height:23px}
  #ctx h3{font:600 17px/1.2 var(--sans)} #ctx .sub{font:400 10px var(--mono);letter-spacing:1.4px;color:var(--mut);text-transform:uppercase;margin-top:4px}
  #ctx .part{margin-top:18px}
  #ctx .part .tag{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
  #ctx .part .tag svg{width:13px;height:13px}
  #ctx p{font:300 13.5px/1.65 var(--sans);color:#d6d6d6;margin-bottom:10px}
  #ctx a{color:#fff;font-weight:500;border-bottom:2px solid var(--c,#fff);cursor:pointer;padding-bottom:1px;transition:background .15s}
  #ctx a:hover{background:color-mix(in srgb,var(--c,#fff) 25%,transparent)}
  #ctx .note{font:400 11.5px var(--sans);color:var(--mut);border-top:1px solid var(--line);padding-top:12px;margin-top:6px;display:flex;gap:8px;align-items:center}
  #ctx .note svg{flex:none;width:14px;height:14px}

  @media (max-width:1100px) and (min-width:761px){
    #brand p{display:none} .search{width:210px}
    #legend{width:auto;padding:8px} #legend .li span,#legend h4,#legend .key,#legend b,#stat{display:none}
    #insp{width:300px} #ctx{width:320px}
  }
  @media (max-width:760px){
    #bar{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;gap:8px;flex-wrap:wrap;background:linear-gradient(#000 70%,rgba(0,0,0,0))}
    #brand h1{font-size:15px} .logo{width:36px;height:36px}
    #bSearch{display:inline-flex;width:38px;padding:0}
    .search{display:none;order:5;width:100%}
    .search.show{display:block}
    #bProp,#bAll,#bReset,#bCtx{display:none}
    #gchips{display:flex;order:6;width:100%;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
    #gchips::-webkit-scrollbar{display:none}
    .gch{flex:none;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:30px;border:1px solid color-mix(in srgb,var(--c) 45%,#000);background:color-mix(in srgb,var(--c) 10%,#000);color:#e6e6e6;font:500 12px var(--sans);cursor:pointer}
    .gch.act{background:color-mix(in srgb,var(--c) 28%,#000);border-color:var(--c)}
    .gch i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0a0a}.gch i svg{width:14px;height:14px}
    #hint{bottom:calc(92px + env(safe-area-inset-bottom));font-size:10px;padding:9px 12px;white-space:normal;text-align:center;width:max-content;max-width:88vw}
    #zoom{display:none}
    #legend{display:none;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));width:auto;max-height:55vh;overflow:auto;z-index:40;padding:14px}
    #legend.open{display:flex} #legend .li span,#legend h4,#legend .key,#legend b,#stat{display:flex} #legend .li span{display:inline} #legend b{display:inline}
    #mbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 38%)}
    #mbar .btn{flex:1;flex-direction:column;gap:3px;height:54px;border-radius:14px;font-size:10.5px;padding:0 2px}
    #mbar .btn svg{width:19px;height:19px}
    #insp,#ctx{left:0;right:0;top:auto;bottom:0;width:auto;max-height:66vh;border-radius:24px 24px 0 0;border-width:1px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);z-index:46;min-height:0}
    #insp.show,#ctx.show{transform:none}
    #insp::before,#ctx::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:#333;margin:-10px auto 14px}
    #iClose,#cClose{top:14px}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="starfield"></canvas><svg id="graph"><defs id="defs"></defs><g id="vp"><g id="guides"></g><g id="edges"></g><g id="nodes"></g></g></svg></div>

<div id="bar">
  <div id="brand"><div class="logo" id="logo"></div><div><h1>Problemáticas de Kennedy</h1><p>Modelamiento dinámico · red causal</p></div></div>
  <button class="btn" id="bSearch" aria-label="Buscar"></button>
  <div class="search" id="dsearch"></div>
  <button class="btn" id="bCtx"></button>
  <button class="btn pri" id="bProp"></button>
  <button class="btn" id="bAll"></button>
  <button class="btn" id="bReset"></button>
  <div id="gchips"></div>
</div>
<div id="hint"></div>
<div id="legend"></div>
<div id="zoom"><button class="btn" id="bIn"></button><button class="btn" id="bOut"></button><button class="btn" id="bFit"></button></div>
<div id="insp"><button id="iClose" aria-label="Cerrar"></button><div id="ibody"></div></div>
<div id="ctx"><button id="cClose" aria-label="Cerrar"></button><div id="cbody"></div></div>
<div id="mbar"><button class="btn" id="mCtx"></button><button class="btn pri" id="mP"></button><button class="btn" id="mAll"></button><button class="btn" id="mReset"></button><button class="btn" id="mLeg"></button></div>

<script src="lib/d3.min.js"></script>
<script src="lib/lucide.min.js"></script>
<script>
/* =====================================================================
   DATOS: 41 variables y 49 conexiones tal como están en el tablero de Miro
   ===================================================================== */
const G = {
  1:{ name:"Hiperconcentración del mercado mayorista", short:"Mercado mayorista",      color:"#ff6b4a", icon:"Store" },

};
// [clave, texto completo, etiqueta corta, icono, grupo, x, y (tablero)]
const ND = [
 ["root","La Fragmentación Territorial","","Puzzle",0,1908,1343],

 ["hig","Modelo de higiene estatal y salubridad pública","Higiene estatal y salubridad pública","SprayCan",1,2330,1665],
 ["epi","Crisis epidémicas, brotes de enfermedades infecciosas","Crisis epidémicas y brotes infecciosos","Biohazard",1,2584,1400],
 ["dep","Dependencia alimentaria","","ShoppingBasket",1,2079,1977],
 ["perd","Pérdida de producción local","","Sprout",1,2079,2292],
 ["crec","Crecimiento demográfico acelerado","","Users",1,2973,2292],
 ["desc","Descomposición acelerada de alimentos al aire libre","Alimentos que se descomponen al aire libre","Apple",1,2925,1400],
 ["infra","Carencia de infraestructura tecnológica","","Cpu",1,2925,1721],
 ["ind","Industrialización tardía del país","","Factory",1,2551,1872],
 ["mono","La monoexportación cafetera","","Coffee",1,2909,1995],
 ["exp","Expulsaron violentamente a millones de campesinos de sus tierras rurales","Expulsión violenta de campesinos","Tractor",1,2604,2636],
 ["mod","Modelo económico: más rentable transformar la tierra rural en suelo urbano","Más rentable volver urbana la tierra rural","Banknote",1,2455,2293],
 ["trans","Sobrecarga de la red de transporte","","Bus",1,1613,1771],
 ["desp","Desplazamientos masivos acumulados en franjas horarias específicas del día","Desplazamientos masivos por franjas horarias","Footprints",1,1340,2107],
 ["cult","Por factores culturales e institucionales estandarizados","Factores culturales e institucionales","Landmark",1,1340,2498],
 ["sinc","Modelo de sincronización industrial y horarios rígidos","Sincronización industrial y horarios rígidos","Settings",1,1738,2498],

function orderGroup(g){
  const hub=HUBS[g-1], seen=new Set([hub]); const same=n=>n.nei.map(o=>o.n).filter(m=>m.g===g&&!seen.has(m)).sort((a,b)=>b.nei.length-a.nei.length);
  const dfs=n=>{ const out=[n]; seen.add(n); same(n).forEach(m=>{ if(!seen.has(m)) out.push(...dfs(m)); }); return out; };
  const subs=[]; same(hub).forEach(m=>{ if(!seen.has(m)) subs.push(dfs(m)); });
  const L=[],Rg=[]; let a=0,b=0; subs.sort((x,y)=>y.length-x.length).forEach(s=>{ if(a<=b){ L.push(s); a+=s.length; } else { Rg.push(s); b+=s.length; } });
  let order=[...L.flat().reverse(),hub,...Rg.flat()];
  members[g].forEach(m=>{ if(!order.includes(m)) { const at=order.findIndex(o=>o.key==="infra"); order.splice(at>=0?at+1:order.length,0,m); } });
  return order;
}

[1,2,3].forEach(g=>{ const list=orderGroup(g), s=sectors[g]; list.forEach((n,i)=>{ n.ang=(s.a0+(i+.5)*(s.a1-s.a0)/list.length)*Math.PI/180; }); s.mid=((s.a0+s.a1)/2)*Math.PI/180; });
nodes.forEach(n=>{ if(n===root){ n.hx=0; n.hy=0; n.ang=0; } else { n.hx=Math.cos(n.ang)*R; n.hy=Math.sin(n.ang)*R; } n.x=n.hx; n.y=n.hy; });

  else { pts=[[s.hx,s.hy]]; const a=gp(s.g), b=gp(t.g); pts.push([a.x,a.y]); if(s.g!==t.g) pts.push([0,0]); pts.push([b.x,b.y]); pts.push([t.hx,t.hy]); }
  const un=(p,q)=>{ const dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy)||1; return [dx/d,dy/d]; };
  const u0=un(pts[0],pts[1]), u1=un(pts[pts.length-2],pts[pts.length-1]);

/* =====================================================================

let sel=null, gfocus=0;
function showNode(n,origin,dl){ if(n.vis) return; n.vis=true; n.by=origin||null; n.el.style.setProperty("--dl",dl+"s"); }
function discover(n){ let i=0; const added=[];
  n.nei.forEach(o=>{ if(!o.n.vis){ showNode(o.n,n,i++*.07); added.push(o.n); } });
  n.extra.forEach(m=>{ if(!m.vis){ showNode(m,n,i++*.07); added.push(m); } });
  n.open=true; return added; }
function undiscover(n){ nodes.filter(m=>m.by===n&&m.vis).forEach(m=>{ m.vis=false; m.by=null; m.open=false; undiscover(m); }); n.open=false; }
function refresh(){
  nodes.forEach(n=>{
    n.el.classList.toggle("on",n.vis); n.el.classList.toggle("sel",n===sel);
    const h=hiddenCount(n); n.el.classList.toggle("more",n.vis&&h>0);
    n.badge.style.display = n.vis&&h>0 ? "" : "none"; n.badgeT.textContent=h;
  });
  let ve=0; edges.forEach(e=>{ const on=e.s.vis&&e.t.vis; if(on) ve++; e.g.classList.toggle("on",on); [e.eb,e.ef].forEach(p=>p.style.setProperty("--dl","0.35s")); });
  $("#sN").textContent=nodes.filter(n=>n.vis).length+"/"+nodes.length; $("#sE").textContent=ve+"/"+edges.length;
  renderInsp();
}
function onNode(n){
  hideHints(); select(n);
  if(hiddenCount(n)>0){ const added=discover(n); refresh(); focusCam([n,...added]); }
  else if(nodes.some(m=>m.by===n&&m.vis)){ undiscover(n); refresh(); }
  else { refresh(); ping(n); }
}
function expandAll(){ nodes.forEach(n=>{ if(!n.vis) showNode(n,root,Math.random()*.6); n.open=true; }); hideHints(); refresh(); setTimeout(()=>fit(),60); }
function reset(){ nodes.forEach(n=>{ n.vis=(n===root); n.by=null; n.open=false; }); sel=null; gfocus=0; legendFocus(); closeInsp(); $("#hint").classList.remove("hide"); refresh(); home(); }
function hideHints(){ $("#hint").classList.add("hide"); }
function ensureVisible(n){
  if(n.vis) return;
  const prev=new Map(), q=nodes.filter(m=>m.vis); const seen=new Set(q); let found=null;
  while(q.length&&!found){ const c=q.shift(); for(const o of c.nei){ if(!seen.has(o.n)){ seen.add(o.n); prev.set(o.n,c); if(o.n===n){ found=o.n; break; } q.push(o.n); } } }
  if(!found){ showNode(n,root,0); return; }
  const chain=[]; let cur=n; while(cur&&!cur.vis){ chain.unshift(cur); cur=prev.get(cur); }
  chain.forEach((m,i)=>showNode(m,prev.get(m),i*.12));
}

function hoverFocus(n){
  if(!n){ if(!gfocus){ nodes.forEach(m=>m.el.classList.remove("dim")); edges.forEach(e=>e.g.classList.remove("dim","hot")); } else applyGroup(); return; }
  const s=new Set([n]); n.nei.forEach(o=>{ if(o.n.vis) s.add(o.n); });
  nodes.forEach(m=>m.el.classList.toggle("dim",m.vis&&!s.has(m)));
  edges.forEach(e=>{ const mine=(e.s===n||e.t===n); e.g.classList.toggle("dim",!mine); e.g.classList.toggle("hot",mine); });
}
function applyGroup(){
  nodes.forEach(m=>m.el.classList.toggle("dim",m.vis&&m!==root&&!m.groups.includes(gfocus)));
  edges.forEach(e=>{ const ok=(e.s===root||e.s.groups.includes(gfocus))&&(e.t===root||e.t.groups.includes(gfocus)); e.g.classList.toggle("dim",!ok); });
}
function legendFocus(){ document.querySelectorAll(".li[data-g],.gch").forEach(l=>l.classList.toggle("act",+l.dataset.g===gfocus&&gfocus>0)); if(gfocus) applyGroup(); else hoverFocus(null); }
function toggleGroup(g){ gfocus=gfocus===g?0:g; legendFocus();
  if(gfocus){ const hub=HUBS[g-1]; if(!hub.vis){ ensureVisible(hub); refresh(); } if(!hub.open){ discover(hub); refresh(); } focusCam(nodes.filter(n=>n.vis&&n.groups.includes(g))); } }

  const chips=n.groups.filter(g=>g>0).map(g=>`<span class="chip" style="--c:${G[g].color}"><i>${icon(G[g].icon,2.4)}</i>${G[g].short}</span>`).join("");
  const sec=(ic,t,arr)=>arr.length?`<div class="isec">${icon(ic,2)}${t}<b>${arr.length}</b></div>${arr.map(relRow).join("")}`:"";
  return `<div class="ih" style="--c:${n.color}"><div class="it">${icon(n.i,1.8)}</div><div><div class="ic">${n===root?"Fenómeno central":n.loose?"Variable sin conexiones":"Variable"}</div><h2>${n.t}</h2></div></div>
  ${n===root?"":`<div class="chips">${chips}</div>`}
  ${n.bridge?`<div class="isec" style="margin-top:14px">${icon("Link2",2)}Variable compartida entre problemas</div>`:""}
  ${sec("ArrowDownToLine","Causas directas (←)",n.inn)}${sec("ArrowUpFromLine","Efectos directos (→)",n.out)}${sec("Link","Relaciones sin dirección",n.und)}
  ${n.loose?`<div class="isec">${icon("Unlink",2)}Sin conectores en el tablero de Miro</div>`:""}
  <div class="isec">${icon("Gauge",2)}Indicadores</div>
  <div class="istats" style="--c:${n.color}"><div>${icon("ArrowDownToLine",2)}<b>${n.inn.length}</b><span>Entradas</span></div><div>${icon("ArrowUpFromLine",2)}<b>${n.out.length}</b><span>Salidas</span></div><div>${icon("Network",2)}<b>${n.nei.length}</b><span>Conexiones</span></div></div>
  <div class="iact"><button class="btn pri" data-a="prop">${icon("Play",2)}Propagar</button><button class="btn" data-a="center">${icon("Crosshair",2)}Centrar</button></div>`;
}
function renderInsp(){
  const box=$("#insp"); if(!sel){ box.classList.remove("show"); return; }
  $("#ibody").innerHTML=inspHTML(sel);
  $("#ibody").querySelectorAll(".rel").forEach(r=>r.onclick=()=>goNode(K[r.dataset.k]));
  $("#ibody").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ if(b.dataset.a==="prop") propagate(sel); else focusCam([sel],true); });
  box.classList.add("show");
}
function select(n){ sel=n; nodes.forEach(m=>m.el.classList.toggle("sel",m===n)); renderInsp(); }
function closeInsp(){ $("#insp").classList.remove("show"); }
$("#iClose").onclick=()=>{ sel=null; nodes.forEach(m=>m.el.classList.remove("sel")); closeInsp(); };
stage.addEventListener("click",()=>{ if(!moved){ $("#iClose").onclick(); $("#legend").classList.remove("open"); } });
function goNode(n){ hideHints(); ensureVisible(n); refresh(); select(n); setTimeout(()=>{ focusCam([n],true); ping(n); },420); }

/* ============ propagación a lo largo de las flechas ============ */
let timers=[];
function ping(n){ n.el.classList.remove("ping"); void n.el.getBoundingClientRect(); n.el.classList.add("ping"); setTimeout(()=>n.el.classList.remove("ping"),1100); }
function propagate(start){
  timers.forEach(clearTimeout); timers=[]; nodes.forEach(n=>n.el.classList.remove("ping"));
  const seen=new Set([start]); let front=[start], lv=0; ping(start);
  while(front.length){
    const nxt=[], step=[];
    front.forEach(n=>{
      n.out.forEach(o=>{ if(o.n.vis&&!seen.has(o.n)){ seen.add(o.n); nxt.push(o.n); step.push({e:o.e,rev:false,n:o.n}); } });
      n.und.forEach(o=>{ if(o.n.vis&&!seen.has(o.n)){ seen.add(o.n); nxt.push(o.n); step.push({e:o.e,rev:o.e.t===n,n:o.n}); } });
    });
    if(step.length){ const d=lv*900;
      timers.push(setTimeout(()=>step.forEach(s=>{ s.e.et.classList.remove("go","rev"); void s.e.et.getBoundingClientRect(); s.e.et.classList.add("go"); if(s.rev) s.e.et.classList.add("rev"); }),d));
      timers.push(setTimeout(()=>step.forEach(s=>ping(s.n)),d+820)); }
    front=nxt; lv++;
  }
}
function runProp(){ if(!HUBS[0].vis){ discover(root); refresh(); focusCam([root,...HUBS]); setTimeout(()=>propagate(root),1000); } else propagate(sel||root); }
$("#bProp").onclick=runProp; $("#mP").onclick=runProp; $("#bAll").onclick=expandAll; $("#mAll").onclick=expandAll; $("#bReset").onclick=reset; $("#mReset").onclick=reset;

/* ============ contexto: la narrativa del problema ============ */
const lk=(k,t)=>`<a data-k="${k}" style="--c:${K[k].color}">${t}</a>`;
$("#cbody").innerHTML=`<div class="ch"><i>${icon("BookOpen",1.8)}</i><div><h3>El problema en palabras</h3><div class="sub">Textos de la exposición · toca lo subrayado</div></div></div>
 <div class="part"><div class="tag">${icon("Puzzle",2)}Lo que identificamos</div>
 <p>Hemos identificado una problemática territorial crítica: la ${lk("root","fragmentación espacial")}. Este fenómeno no constituye un evento aislado, sino que es el producto acumulado de contradicciones estructurales que operan en el territorio.</p>
 <p>El primer eje de esta problemática es la ${lk("may","hiperconcentración del mercado mayorista")}, cuyos síntomas iniciales se vinculan directamente con los modelos históricos de ${lk("hig","higiene estatal y salubridad pública")}.</p></div>
 <div class="part"><div class="tag">${icon("Route",2)}Por qué falla la planificación</div>
 <p>La falla de fondo del POT es asumir que Corabastos es solo un predio que se puede mover en el mapa, ignorando que funciona como el corazón de un tejido vivo de economía popular que sostiene a Kennedy y a la ciudad.</p>
 <p>Además, la norma fragmenta la localidad en piezas aisladas: dibuja reservas hídricas protegidas, pero al mismo tiempo consolida el ${lk("trans","tráfico de tractomulas")} por la Avenida Ciudad de Cali y la Carrera 80, bordeando los mismos ${lk("eco","ecosistemas")} que promete cuidar.</p>
 <p>Pretender resolver una sobrecarga de escala regional mediante intervenciones físicas locales y desarticuladas es la razón por la que la planificación choca con la realidad del territorio.</p></div>
 <div class="note">${icon("Network",2)}Cada término subrayado te lleva a su variable dentro de la red.</div>`;
function toggleCtx(force){ const c=$("#ctx"); const on=force===undefined?!c.classList.contains("show"):force; c.classList.toggle("show",on); if(on){ $("#legend").classList.remove("open"); if(isMobile()) $("#iClose").onclick(); } }
$("#bCtx").onclick=()=>toggleCtx(); $("#mCtx").onclick=()=>toggleCtx(); $("#cClose").onclick=()=>toggleCtx(false);
$("#cbody").querySelectorAll("a[data-k]").forEach(a=>a.onclick=()=>{ if(isMobile()) toggleCtx(false); goNode(K[a.dataset.k]); });

/* ============ cámara ============ */
const DUR=1000; let W=innerWidth,H=innerHeight,T=d3.zoomIdentity,moved=false,startT=T;
const zoom=d3.zoom().scaleExtent([.1,2.8]).clickDistance(5)
  .on("start",()=>{ moved=false; })
  .on("zoom",e=>{ T=e.transform; vp.attr("transform",T); if(e.sourceEvent&&e.sourceEvent.type!=="wheel"&&Math.hypot(T.x-startT.x,T.y-startT.y)>4){ moved=true; stage.classList.add("drag"); } drawStars(); })
  .on("end",()=>{ stage.classList.remove("drag"); setTimeout(()=>moved=false,0); });
svg.call(zoom).on("dblclick.zoom",null).on("pointerdown.t",()=>{ startT=T; });
function goto(t,ms=DUR){ svg.transition().duration(ms).ease(d3.easeCubicInOut).call(zoom.transform,t); }
const homeT=()=>d3.zoomIdentity.translate(W/2,H/2+(isMobile()?-20:10)).scale(isMobile()?.9:1);
function home(){ goto(homeT()); }
function box(ns){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const add=(x,y)=>{ x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); };
  ns.forEach(n=>{ add(n.hx-n.r-20,n.hy-n.r-20); add(n.hx+n.r+20,n.hy+n.r+20); if(n!==root){ const L=Math.min(n.s.length,30)*6.6+24; add(n.hx+Math.cos(n.ang)*(n.r+L),n.hy+Math.sin(n.ang)*(n.r+L)); } else add(0,n.r+50); }); return {x0,y0,x1,y1}; }
const pads=()=>isMobile()?{l:10,r:10,t:150,b:110}:{l:60,r:$("#insp").classList.contains("show")&&W>1100?370:70,t:96,b:84};
function fit(ns){ const v=ns||nodes.filter(n=>n.vis), b=box(v), p=pads(); const k=Math.min((W-p.l-p.r)/(b.x1-b.x0),(H-p.t-p.b)/(b.y1-b.y0),1.2);
  goto(d3.zoomIdentity.translate(p.l+(W-p.l-p.r-(b.x1-b.x0)*k)/2-b.x0*k,p.t+(H-p.t-p.b-(b.y1-b.y0)*k)/2-b.y0*k).scale(k)); }
function focusCam(ns,center){
  const b=box(ns), p=pads(); let k=T.k; const need=Math.min((W-p.l-p.r)/(b.x1-b.x0),(H-p.t-p.b)/(b.y1-b.y0)); if(need<k) k=Math.max(.18,need);
  if(center){ k=Math.max(k,isMobile()?.85:.95); const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2; goto(d3.zoomIdentity.translate((p.l+W-p.r)/2-cx*k,(p.t+H-p.b)/2-cy*k).scale(k),850); return; }
  let tx=T.x,ty=T.y; const L=b.x0*k+tx,Rr=b.x1*k+tx,Tp=b.y0*k+ty,B=b.y1*k+ty;
  if(L<p.l) tx+=p.l-L; else if(Rr>W-p.r) tx-=Rr-(W-p.r); if(Tp<p.t) ty+=p.t-Tp; else if(B>H-p.b) ty-=B-(H-p.b);
  if(k!==T.k||tx!==T.x||ty!==T.y) goto(d3.zoomIdentity.translate(tx,ty).scale(k),820);
}
$("#bIn").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.35); $("#bOut").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.35); $("#bFit").onclick=()=>fit();
addEventListener("resize",()=>{ W=innerWidth; H=innerHeight; sizeStars(); });

/* ============ fondo: polvo de estrellas con paralaje ============ */
const cv=$("#starfield"), cx=cv.getContext("2d"); let stars=[],DPR=Math.min(devicePixelRatio||1,2);
function sizeStars(){ cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); stars=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,a:Math.random()*.6+.15,z:Math.random()*.5+.1})); drawStars(); }
function drawStars(){ cx.clearRect(0,0,W,H); stars.forEach(s=>{ const x=((s.x+T.x*s.z*.4)%W+W)%W, y=((s.y+T.y*s.z*.4)%H+H)%H; cx.globalAlpha=s.a; cx.fillStyle="#fff"; cx.beginPath(); cx.arc(x,y,s.r,0,6.283); cx.fill(); }); cx.globalAlpha=1; }

/* ============ buscador ============ */
(function(){
  const inp=$("#q"), res=$("#res"); let hits=[], act=-1;
  const run=()=>{ const t=norm(inp.value.trim()); hits=t?nodes.filter(n=>n!==root&&(norm(n.t).includes(t)||norm(n.s).includes(t))).slice(0,7):[]; act=-1; res.innerHTML="";
    hits.forEach(n=>{ const d=document.createElement("div"); d.style.setProperty("--c",n.color); d.innerHTML=`<span class="ri">${icon(n.i)}</span><span>${n.s}</span>`; d.onmousedown=d.ontouchstart=e=>{ e.preventDefault(); pick(n); }; res.appendChild(d); });
    res.classList.toggle("show",hits.length>0); };
  const pick=n=>{ inp.value=""; res.classList.remove("show"); inp.blur(); $("#dsearch").classList.remove("show"); goNode(n); };
  inp.addEventListener("input",run);
  inp.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; [...res.children].forEach((c,i)=>c.classList.toggle("act",i===act)); }
    else if(e.key==="Enter"&&hits.length) pick(hits[Math.max(0,act)]); else if(e.key==="Escape"){ inp.value=""; run(); inp.blur(); } });
  inp.addEventListener("blur",()=>setTimeout(()=>res.classList.remove("show"),180));
})();

/* ============ inicio ============ */
root.vis=true; svg.call(zoom.transform,homeT()); sizeStars(); refresh();
const hs=location.hash;
if(hs==="#todo") expandAll();
else if(hs.startsWith("#n=")&&K[hs.slice(3)]) goNode(K[hs.slice(3)]);
</script>
