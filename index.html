<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problemáticas de Kennedy · Mapa causal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#0a0a0a; --line:#242424; --line2:#383838; --fg:#ececec; --mut:#8b8b8b; --dim:#5c5c5c;
    --p1:#ff6b4a; --p2:#f2c230; --p3:#35c9e8;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);
    user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;cursor:grab;
    background-image:radial-gradient(#1c1c1c 1px,transparent 1.1px);background-size:24px 24px}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  /* ---- conectores ---- */
  .base{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;
    stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1) var(--dl,0s),opacity .3s var(--dl,0s)}
  .base.on{opacity:.55;stroke-dashoffset:0}
  .flow{fill:none;stroke:var(--c);stroke-width:2.2;stroke-dasharray:2 12;stroke-linecap:round;opacity:0;transition:opacity .4s calc(var(--dl,0s) + .5s);animation:flow 1.1s linear infinite}
  .flow.on{opacity:.95}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .arrow{fill:var(--c);opacity:0;transition:opacity .25s calc(var(--dl,0s) + .55s)}
  .arrow.on{opacity:.9}
  .trav{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.16 1.4;stroke-dashoffset:.16;opacity:0;filter:drop-shadow(0 0 4px var(--c))}
  .trav.go{opacity:1;animation:trav .75s cubic-bezier(.4,0,.6,1) forwards}
  @keyframes trav{from{stroke-dashoffset:.16}to{stroke-dashoffset:-1}}
  .dimL{opacity:.08!important}

  /* ---- guías de nivel ---- */
  .guide{position:absolute;top:-70px;height:2000px;width:0;border-left:1px dashed #1a1a1a;opacity:0;transition:opacity .6s;pointer-events:none}
  .guide.on{opacity:1}
  .guide span{position:absolute;top:0;left:10px;font:500 10px var(--mono);letter-spacing:1.5px;color:#4a4a4a;white-space:nowrap}

  /* ---- nodos ---- */
  .node{position:absolute;display:flex;align-items:center;gap:10px;padding:0 12px 0 8px;background:#0b0b0b;border:1px solid var(--line2);
    border-left:3px solid var(--c);border-radius:7px;cursor:pointer;opacity:0;pointer-events:none;
    transform:translate(var(--dx),var(--dy)) scale(.85);
    transition:transform .65s cubic-bezier(.2,.9,.3,1) var(--dl,0s),opacity .35s var(--dl,0s),border-color .2s,background .2s,box-shadow .2s}
  .node.on{opacity:1;pointer-events:auto;transform:none}
  .node:hover{background:#121212;border-color:#6a6a6a;border-left-color:var(--c)}
  .node.sel{border-color:#fff;border-left-color:var(--c);background:#141414}
  .node.dim{opacity:.18}
  .node.ping{animation:ping .9s ease-out}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 16px transparent}}
  .tile{flex:none;width:34px;height:34px;border:1px solid color-mix(in srgb,var(--c) 55%,#000);border-radius:6px;display:grid;place-items:center;
    color:var(--c);background:color-mix(in srgb,var(--c) 9%,#000)}
  .tile svg{width:19px;height:19px}
  .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
  .id{font:500 10px var(--mono);letter-spacing:.6px;color:var(--dim)}
  .lb{font:500 12.5px/1.16 var(--sans);color:var(--fg);letter-spacing:.05px}
  .cnt{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;font:500 11px var(--mono);color:var(--mut)}
  .cnt svg{width:12px;height:12px;transition:transform .25s}
  .node.open .cnt svg{transform:rotate(90deg)}
  .node.open .cnt{color:var(--c)}
  .node.d1 .lb{font-size:14px;font-weight:600}
  .node.d1 .tile{width:40px;height:40px}.node.d1 .tile svg{width:22px;height:22px}
  .node.d0{background:#f2f2f2;border-color:#f2f2f2;border-left:3px solid #f2f2f2;color:#000}
  .node.d0 .tile{border-color:#000;color:#000;background:transparent;width:46px;height:46px}.node.d0 .tile svg{width:26px;height:26px}
  .node.d0 .lb{color:#000;font-size:15px;font-weight:600}.node.d0 .id{color:#555}.node.d0 .cnt{color:#000}
  .node.d0:hover{background:#fff}
  .node.d0::after{content:"";position:absolute;inset:-7px;border:1px solid #fff;border-radius:11px;opacity:0;animation:ring 2.4s ease-out infinite;pointer-events:none}
  .node.d0.open::after{display:none}
  @keyframes ring{0%{transform:scale(.97);opacity:.7}100%{transform:scale(1.18,1.5);opacity:0}}

  /* ---- interfaz ---- */
  #bar{position:fixed;left:0;right:0;top:0;height:60px;z-index:20;display:flex;align-items:center;gap:20px;padding:0 20px;
    background:linear-gradient(#000 60%,rgba(0,0,0,0));pointer-events:none}
  #bar>*{pointer-events:auto}
  #brand h1{font:600 17px var(--sans);letter-spacing:.1px}
  #brand p{font:400 10px var(--mono);letter-spacing:1.6px;color:var(--mut);margin-top:3px;text-transform:uppercase}
  #search{position:relative;margin-left:auto;width:300px}
  #q{width:100%;height:36px;background:#080808;color:#fff;border:1px solid var(--line2);border-radius:7px;padding:0 12px 0 34px;font:400 13px var(--sans);outline:none;transition:border-color .2s}
  #q:focus{border-color:#8a8a8a}
  #q::placeholder{color:#666}
  #search svg{position:absolute;left:11px;top:11px;width:14px;height:14px;color:#777}
  #res{position:absolute;left:0;right:0;top:40px;background:#0a0a0a;border:1px solid var(--line2);border-radius:7px;display:none;max-height:300px;overflow:auto}
  #res.show{display:block}
  #res div{padding:9px 12px;font:400 13px/1.3 var(--sans);cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #151515}
  #res div:last-child{border:0}
  #res div:hover,#res div.act{background:#151515}
  #res i{width:3px;align-self:stretch;background:var(--c);border-radius:2px;flex:none}
  #res small{font:400 10px var(--mono);color:var(--dim);margin-left:auto;flex:none}
  .btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;background:#080808;color:var(--fg);border:1px solid var(--line2);border-radius:7px;
    font:500 12.5px var(--sans);cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
  .btn:hover{background:#151515;border-color:#7a7a7a}
  .btn svg{width:15px;height:15px}
  .btn.pri{background:#f2f2f2;color:#000;border-color:#f2f2f2}.btn.pri:hover{background:#fff}
  #hint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:15;pointer-events:none;
    font:500 11px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--fg);padding:9px 14px;border:1px solid var(--line2);border-radius:6px;background:#050505;
    animation:hb 2s ease-in-out infinite;transition:opacity .4s}
  #hint.hide{opacity:0}
  @keyframes hb{50%{transform:translate(-50%,-6px)}}
  #legend{position:fixed;left:20px;bottom:20px;z-index:15;display:flex;flex-direction:column;gap:9px;padding:14px 16px;background:#050505;border:1px solid var(--line);border-radius:9px}
  #legend h4{font:500 10px var(--mono);letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
  #legend div{display:flex;align-items:center;gap:10px;font:400 12.5px var(--sans);color:#cfcfcf}
  #legend i{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
  #legend b{margin-left:auto;padding-left:14px;font:500 11px var(--mono);color:var(--mut)}
  #mini{position:fixed;right:20px;bottom:20px;z-index:15;width:230px;height:140px;background:#050505;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer}
  #mini svg{width:100%;height:100%;display:block}
  #mini .vp{fill:rgba(255,255,255,.06);stroke:#fff;stroke-width:6;vector-effect:non-scaling-stroke}
  #zoom{position:fixed;right:20px;bottom:172px;z-index:15;display:flex;flex-direction:column;gap:6px}
  #zoom .btn{width:36px;padding:0;justify-content:center;font-size:17px}
  #insp{position:fixed;right:20px;top:72px;width:310px;z-index:18;padding:18px;background:#080808;border:1px solid var(--line2);border-radius:11px;
    opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s}
  #insp.show{opacity:1;transform:none;pointer-events:auto}
  #insp .top{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:1px;color:var(--mut);text-transform:uppercase}
  #insp .top i{width:9px;height:9px;border-radius:2px;background:var(--c)}
  #insp .top button{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;font:400 18px var(--sans)}
  #insp h2{font:600 18px/1.25 var(--sans);margin:12px 0 14px}
  #insp .sec{font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:14px 0 8px}
  #insp .path{display:flex;flex-direction:column;gap:0}
  #insp .path div{position:relative;padding:0 0 9px 18px;font:400 12.5px/1.3 var(--sans);color:#bdbdbd}
  #insp .path div::before{content:"";position:absolute;left:3px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--c)}
  #insp .path div::after{content:"";position:absolute;left:6px;top:14px;bottom:-1px;width:1px;background:var(--line2)}
  #insp .path div:last-child::after{display:none}
  #insp .path div:last-child{color:#fff;font-weight:500;padding-bottom:0}
  #insp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #insp .stats div{border:1px solid var(--line);border-radius:7px;padding:9px 10px}
  #insp .stats b{display:block;font:500 19px var(--mono);color:#fff}
  #insp .stats span{font:400 10px var(--sans);color:var(--mut);letter-spacing:.3px}
  #insp .act{display:flex;gap:8px;margin-top:16px}
  #insp .act .btn{flex:1;justify-content:center;padding:0 8px}
  @media (max-width:900px){ #search{width:190px} #brand p{display:none} #legend{display:none} #mini{display:none} #zoom{bottom:20px} #insp{top:auto;bottom:20px;left:20px;right:20px;width:auto} }
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="links" width="1" height="1"></svg></div></div>

<div id="bar">
  <div id="brand"><h1>Problemáticas de Kennedy</h1><p>Modelamiento dinámico · Mapa causal de la fragmentación territorial</p></div>
  <div id="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Buscar variable…" autocomplete="off"><div id="res"></div></div>
  <button class="btn pri" id="bProp"></button>
  <button class="btn" id="bAll"></button>
  <button class="btn" id="bReset"></button>
</div>
<div id="hint">Haz clic en el nodo central para desplegar el sistema</div>
<div id="legend"></div>
<div id="zoom"><button class="btn" id="bIn">+</button><button class="btn" id="bOut">−</button><button class="btn" id="bFit" style="font-size:12px"></button></div>
<div id="mini"><svg id="miniSvg"></svg></div>
<div id="insp"><div class="top"><i></i><span class="code"></span><button id="iClose" aria-label="Cerrar">×</button></div><h2></h2>
  <div class="sec">Ruta desde el fenómeno</div><div class="path"></div>
  <div class="sec">Indicadores</div><div class="stats"></div>
  <div class="act"><button class="btn pri" id="iProp"></button><button class="btn" id="iBranch"></button></div></div>

<script src="lib/d3.min.js"></script>
<script src="lib/lucide.min.js"></script>
<script>
/* ============ Datos (tablero de Miro) · i = icono · s = etiqueta corta ============ */
const COL = { p1:"#ff6b4a", p2:"#f2c230", p3:"#35c9e8" };
const DATA = { t:"La Fragmentación Territorial", i:"Puzzle", c:[
  { t:"Hiperconcentración del mercado mayorista", i:"Store", color:COL.p1, c:[
      { t:"Dependencia alimentaria", i:"ShoppingBasket", c:[
        { t:"Pérdida de producción local", i:"Sprout", c:[
          { t:"Modelo económico: más rentable convertir tierra rural en suelo urbano", s:"Más rentable volver urbana la tierra rural", i:"Banknote", c:[
            { t:"Crecimiento demográfico acelerado", i:"Users", c:[
              { t:"Expulsión violenta de millones de campesinos de sus tierras rurales", s:"Expulsión violenta de campesinos", i:"Tractor" } ]} ]} ]} ]},
      { t:"Modelo de higiene estatal y salubridad pública", s:"Higiene estatal y salubridad pública", i:"SprayCan", c:[
        { t:"Crisis epidémicas y brotes de enfermedades infecciosas", s:"Crisis epidémicas y brotes infecciosos", i:"Biohazard", c:[
          { t:"Descomposición acelerada de alimentos al aire libre", s:"Alimentos que se descomponen al aire libre", i:"Apple", c:[
            { t:"Carencia de infraestructura tecnológica", i:"Cpu", c:[
              { t:"Industrialización tardía del país", i:"Factory", c:[
                { t:"La monoexportación cafetera", i:"Coffee" } ]} ]} ]} ]} ]},
      { t:"Sobrecarga de la red de transporte", i:"Bus", c:[
        { t:"Concentración espacial de origen y destino", i:"MapPin", c:[
          { t:"Densificación residencial en altura", i:"Building2", c:[
            { t:"Especulación del suelo", i:"TrendingUp", c:[ { t:"Escasez de suelo", i:"Layers" } ]} ]},
          { t:"Clusters laborales", i:"Briefcase", c:[
            { t:"Proceso histórico de expansión monocéntrica de Bogotá", s:"Expansión monocéntrica de Bogotá", i:"Target", c:[
              { t:"Economías de aglomeración", i:"Network" } ]} ]} ]},
        { t:"Desplazamientos masivos en franjas horarias específicas", s:"Desplazamientos masivos por franjas horarias", i:"Footprints", c:[
          { t:"Factores culturales e institucionales estandarizados", s:"Factores culturales e institucionales", i:"Landmark" },
          { t:"Modelo de sincronización industrial y horarios rígidos", s:"Sincronización industrial y horarios rígidos", i:"Settings" } ]} ]}
  ]},
  { t:"Saturación de los residuos", i:"Trash2", color:COL.p2, c:[
      { t:"Presión sobre los sistemas de saneamiento", i:"Gauge", c:[
        { t:"Generación de aguas residuales", i:"Droplet", c:[
          { t:"Cargas contaminantes en aguas superficiales", i:"FlaskConical" } ]} ]}
  ]},
  { t:"Degradación de la capacidad de soporte ecológico", i:"Globe", color:COL.p3, c:[
      { t:"Deterioro de la calidad del aire", i:"Wind", c:[ { t:"Emisiones de NO₂ y CO", i:"Car" } ]},
      { t:"Deterioro de la calidad del agua", i:"Droplets" },
      { t:"Pérdida de la biodiversidad", i:"Bird", c:[ { t:"Falta de disponibilidad de hábitats naturales", s:"Faltan hábitats naturales", i:"TreePine" } ]},
      { t:"Vulnerabilidad frente a eventos de lluvia", i:"CloudRain" },
      { t:"Planificación urbana orientada al mercado y no a la descentralización", s:"Planificación urbana orientada al mercado", i:"PencilRuler", c:[
        { t:"Transformación en superficies construidas", i:"Construction", c:[
          { t:"Alteración de las condiciones del suelo", i:"Mountain" },
          { t:"Impermeabilización del suelo", i:"BrickWall" },
          { t:"Fragmentación de la cobertura vegetal", i:"Scissors" },
          { t:"Pérdida de la cobertura vegetal", i:"Leaf" } ]} ]}
  ]}
]};

/* ============ Iconos ============ */
function icon(name, sw=1.7){
  const d = lucide.icons[name]; if(!d) return "";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d[2].map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`).join("")}</svg>`;
}
const $ = s => document.querySelector(s);
$("#bProp").innerHTML = icon("Play",2)+"Propagar";
$("#bAll").innerHTML  = icon("Network",2)+"Expandir todo";
$("#bReset").innerHTML= icon("RotateCcw",2)+"Reiniciar";
$("#bFit").innerHTML  = icon("Maximize",2);
$("#iProp").innerHTML = icon("Play",2)+"Propagar";
$("#iBranch").innerHTML = icon("ListTree",2)+"Abrir rama";

/* ============ Árbol: numeración jerárquica y posiciones ============ */
const COLX=[0,350,696,1020,1344,1668,1992,2316], WID=[280,290,270,270,270,270,270,270], HEI=[72,66,60,60,60,60,60,60], PITCH=72, GAP=.55;
const all=[]; let leaf=0;
function prep(n,parent,depth,code,color){
  n.parent=parent; n.depth=depth; n.code=code; n.color=n.color||color||"#f2f2f2"; n.kids=n.c||[]; n.open=false; n.vis=false; n.id=all.length; all.push(n);
  n.kids.forEach((k,i)=>prep(k,n,depth+1,code?code+"."+(i+1):String(i+1),n.color));
  if(!n.kids.length){ n.row=leaf++; } else n.row=n.kids.reduce((s,k)=>s+k.row,0)/n.kids.length;
  if(depth===1) leaf+=GAP;
}
prep(DATA,null,0,"",null);
const rootRow=DATA.row;
all.forEach(n=>{ n.x=COLX[n.depth]; n.w=WID[n.depth]; n.h=HEI[n.depth]; n.y=(n.row-rootRow)*PITCH; n.desc=0; });
all.forEach(n=>{ for(let p=n.parent;p;p=p.parent) p.desc++; });
const label = n => n.s || n.t;
const branches = DATA.kids;

/* ============ DOM ============ */
const stage=$("#stage"), world=$("#world"), svg=d3.select("#links");
const NS="http://www.w3.org/2000/svg";
const defs=null;
const guides=[];
for(let d=1; d<COLX.length; d++){ const g=document.createElement("div"); g.className="guide"; g.style.left=(COLX[d]-24)+"px"; g.innerHTML=`<span>NIVEL ${d}</span>`; world.appendChild(g); guides[d]=g; }

all.forEach(n=>{
  const e=document.createElement("div");
  e.className=`node d${Math.min(n.depth,2)}`; e.style.setProperty("--c",n.color);
  e.style.width=n.w+"px"; e.style.height=n.h+"px"; e.style.left=n.x+"px"; e.style.top=(n.y-n.h/2)+"px";
  const p=n.parent||n; e.style.setProperty("--dx",(p.x+(n.parent?p.w-n.x:0))+"px"); e.style.setProperty("--dy",(p.y-n.y)+"px");
  e.innerHTML=`<div class="tile">${icon(n.i)}</div><div class="txt"><span class="id">${n.depth===0?"FENÓMENO":n.code}</span><span class="lb">${label(n)}</span></div>${n.kids.length?`<div class="cnt"><span>${n.kids.length}</span>${icon("ChevronRight",2.4)}</div>`:""}`;
  e.title=n.t; n.el=e; world.appendChild(e);
  e.addEventListener("click",ev=>{ ev.stopPropagation(); select(n); toggle(n); });
  e.addEventListener("mouseenter",()=>focusLine(n)); e.addEventListener("mouseleave",()=>focusLine(null));
  if(n.parent){
    const a={x:p.x+p.w,y:p.y}, b={x:n.x,y:n.y};
    const mx=b.x-28, dy=b.y-a.y, r=Math.min(10,Math.abs(dy)/2), s=dy>0?1:-1;
    const d = Math.abs(dy)<2 ? `M${a.x} ${a.y}H${b.x-9}` : `M${a.x} ${a.y}H${mx-r}Q${mx} ${a.y} ${mx} ${a.y+s*r}V${b.y-s*r}Q${mx} ${b.y} ${mx+r} ${b.y}H${b.x-9}`;
    const mk=(cls,pl)=>{ const el=document.createElementNS(NS,"path"); el.setAttribute("class",cls); el.setAttribute("d",d); if(pl) el.setAttribute("pathLength","1"); el.style.setProperty("--c",n.color); $("#links").appendChild(el); return el; };
    n.base=mk("base",true); n.flow=mk("flow",false); n.trav=mk("trav",true);
    const ar=document.createElementNS(NS,"path"); ar.setAttribute("class","arrow"); ar.setAttribute("d",`M${b.x-10} ${b.y-5}L${b.x-1} ${b.y}L${b.x-10} ${b.y+5}Z`); ar.style.setProperty("--c",n.color); $("#links").appendChild(ar); n.arrow=ar;
  }
});

/* ============ mostrar / ocultar ============ */
let moved=false;
function setDelay(n,t){ n.el.style.setProperty("--dl",t+"s"); if(n.base){ [n.base,n.flow,n.arrow].forEach(x=>x.style.setProperty("--dl",t+"s")); } }
function showN(n,t){ setDelay(n,t); n.vis=true; n.el.classList.add("on"); if(n.base){ n.base.classList.add("on"); n.flow.classList.add("on"); n.arrow.classList.add("on"); } }
function hideN(n){ n.vis=false; n.open=false; setDelay(n,0); n.el.classList.remove("on","open"); if(n.base){ n.base.classList.remove("on"); n.flow.classList.remove("on"); n.arrow.classList.remove("on"); } n.kids.forEach(hideN); }
function expand(n,base=0){ if(!n.kids.length) return; n.open=true; n.el.classList.add("open"); n.kids.forEach((k,i)=>showN(k,base+i*.06)); }
function collapse(n){ n.open=false; n.el.classList.remove("open"); n.kids.forEach(hideN); }
function visible(){ return all.filter(n=>n.vis); }
function toggle(n){
  if(!n.kids.length) return;
  n.open ? collapse(n) : expand(n);
  $("#hint").classList.add("hide"); afterChange(n.open ? [n,...n.kids] : null);
}
function afterChange(focusNodes){
  const md=Math.max(0,...visible().map(n=>n.depth)); guides.forEach((g,d)=>g&&g.classList.toggle("on",d<=md));
  drawMini(); updateInsp(); if(focusNodes) reveal(focusNodes);
}
function expandAll(){ all.forEach(n=>{ if(n.kids.length){ n.open=true; n.el.classList.add("open"); n.kids.forEach(k=>showN(k,k.depth*.12+Math.random()*.05)); } }); $("#hint").classList.add("hide"); afterChange(null); fit(); }
function openSub(n){ (function r(m,d){ if(m.kids.length){ m.open=true; m.el.classList.add("open"); m.kids.forEach(k=>showN(k,d*.12)); m.kids.forEach(k=>r(k,d+1)); } })(n,0); $("#hint").classList.add("hide"); afterChange(null); reveal([n,...descendants(n)]); }
function reset(){ collapse(DATA); sel=null; all.forEach(n=>n.el.classList.remove("sel")); $("#insp").classList.remove("show"); $("#hint").classList.remove("hide"); afterChange(null); home(); }
function descendants(n){ const o=[]; (function r(m){ m.kids.forEach(k=>{ o.push(k); r(k); }); })(n); return o; }

/* ============ resaltado por linaje ============ */
function lineage(n){ const s=new Set(); for(let p=n;p;p=p.parent) s.add(p); (function dn(m){ m.kids.forEach(k=>{ if(k.vis){ s.add(k); dn(k); } }); })(n); return s; }
function focusLine(n){
  if(!n){ all.forEach(m=>{ m.el.classList.remove("dim"); if(m.base){ m.base.classList.remove("dimL"); m.flow.classList.remove("dimL"); m.arrow.classList.remove("dimL"); } }); return; }
  const s=lineage(n);
  all.forEach(m=>{ const on=s.has(m); m.el.classList.toggle("dim",!on && m.vis); if(m.base){ const dm=!(s.has(m)&&s.has(m.parent)); [m.base,m.flow,m.arrow].forEach(x=>x.classList.toggle("dimL",dm)); } });
}

/* ============ Inspector ============ */
let sel=null;
function select(n){ sel=n; all.forEach(m=>m.el.classList.toggle("sel",m===n)); updateInsp(); }
function updateInsp(){
  const n=sel, box=$("#insp"); if(!n){ box.classList.remove("show"); return; }
  box.style.setProperty("--c",n.color); box.querySelector(".code").textContent=(n.depth===0?"Fenómeno · ":"Variable ")+n.code;
  box.querySelector("h2").textContent=n.t;
  const trail=[]; for(let p=n;p;p=p.parent) trail.unshift(p);
  box.querySelector(".path").innerHTML=trail.map(p=>`<div>${label(p)}</div>`).join("");
  const visKids=n.kids.filter(k=>k.vis).length;
  box.querySelector(".stats").innerHTML=`<div><b>${n.depth}</b><span>Nivel</span></div><div><b>${n.kids.length}</b><span>Directas</span></div><div><b>${n.desc}</b><span>Descendientes</span></div>`;
  $("#iBranch").style.display = n.kids.length ? "" : "none";
  box.classList.add("show");
}
$("#iClose").onclick=()=>{ sel=null; all.forEach(m=>m.el.classList.remove("sel")); $("#insp").classList.remove("show"); };
$("#iProp").onclick=()=>sel&&propagate(sel);
$("#iBranch").onclick=()=>sel&&openSub(sel);
stage.addEventListener("click",()=>{ if(!moved) $("#iClose").onclick(); });

/* ============ Propagación (animación del flujo causal) ============ */
let propTimers=[];
function propagate(start){
  propTimers.forEach(clearTimeout); propTimers=[];
  const levels=[[start]];
  for(let l=0; l<10; l++){ const nxt=[]; levels[l].forEach(n=>n.kids.forEach(k=>{ if(k.vis) nxt.push(k); })); if(!nxt.length) break; levels.push(nxt); }
  if(levels.length===1){ start.el.classList.remove("ping"); void start.el.offsetWidth; start.el.classList.add("ping"); return; }
  levels.forEach((lv,i)=>{ propTimers.push(setTimeout(()=>{ lv.forEach(n=>{
      if(n.trav){ n.trav.classList.remove("go"); void n.trav.getBoundingClientRect(); n.trav.classList.add("go"); }
      const t=setTimeout(()=>{ n.el.classList.remove("ping"); void n.el.offsetWidth; n.el.classList.add("ping"); },i===0?0:700); propTimers.push(t); });
  }, i*700)); });
  start.el.classList.remove("ping"); void start.el.offsetWidth; start.el.classList.add("ping");
}
$("#bProp").onclick=()=>{ if(!DATA.open){ expand(DATA); $("#hint").classList.add("hide"); afterChange([DATA,...DATA.kids]); setTimeout(()=>propagate(DATA),900); } else propagate(DATA); };

/* ============ Cámara (d3.zoom) ============ */
const DUR=900;
let W=innerWidth, H=innerHeight, T=d3.zoomIdentity;
const zoom=d3.zoom().scaleExtent([.12,2.5]).clickDistance(5)
  .on("start",e=>{ moved=false; })
  .on("zoom",e=>{ T=e.transform; world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`; if(e.sourceEvent&&e.sourceEvent.type!=="wheel"){ if(Math.hypot(e.transform.x-startT.x,e.transform.y-startT.y)>4) moved=true; } updateVP(); })
  .on("end",()=>{ stage.classList.remove("drag"); setTimeout(()=>moved=false,0); });
let startT=T; d3.select(stage).call(zoom).on("dblclick.zoom",null).on("mousedown.t",()=>{ startT=T; stage.classList.add("drag"); });
const sSel=()=>d3.select(stage);
function goto(t,ms=DUR){ sSel().transition().duration(ms).ease(d3.easeCubicInOut).call(zoom.transform,t); }
function home(){ goto(d3.zoomIdentity.translate(W*.14,H*.5+20).scale(1)); }
function bbox(nodes){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; nodes.forEach(n=>{ x0=Math.min(x0,n.x); x1=Math.max(x1,n.x+n.w); y0=Math.min(y0,n.y-n.h/2); y1=Math.max(y1,n.y+n.h/2); }); return {x0,y0,x1,y1}; }
function fit(nodes){
  const v=nodes||visible(), b=bbox(v), pad={l:60,r:360,t:100,b:90};
  const k=Math.min((W-pad.l-pad.r)/(b.x1-b.x0),(H-pad.t-pad.b)/(b.y1-b.y0),1.15);
  goto(d3.zoomIdentity.translate(pad.l+(W-pad.l-pad.r-(b.x1-b.x0)*k)/2-b.x0*k, pad.t+(H-pad.t-pad.b-(b.y1-b.y0)*k)/2-b.y0*k).scale(k));
}
function reveal(nodes){ // mantiene el zoom y solo desplaza/aleja lo necesario para que se vea lo que se abrió
  const b=bbox(nodes), pad={l:50,r:360,t:100,b:90};
  let k=T.k; const need=Math.min((W-pad.l-pad.r)/(b.x1-b.x0),(H-pad.t-pad.b)/(b.y1-b.y0)); if(need<k) k=Math.max(.3,need);
  let tx=T.x, ty=T.y; const L=b.x0*k+tx, R=b.x1*k+tx, Tp=b.y0*k+ty, B=b.y1*k+ty;
  if(L<pad.l) tx+=pad.l-L; else if(R>W-pad.r) tx-=R-(W-pad.r);
  if(Tp<pad.t) ty+=pad.t-Tp; else if(B>H-pad.b) ty-=B-(H-pad.b);
  if(k!==T.k||tx!==T.x||ty!==T.y) goto(d3.zoomIdentity.translate(tx,ty).scale(k),750);
}
$("#bIn").onclick=()=>sSel().transition().duration(300).call(zoom.scaleBy,1.35);
$("#bOut").onclick=()=>sSel().transition().duration(300).call(zoom.scaleBy,1/1.35);
$("#bFit").onclick=()=>fit();
$("#bAll").onclick=expandAll; $("#bReset").onclick=reset;
addEventListener("resize",()=>{ W=innerWidth; H=innerHeight; updateVP(); });

/* ============ Minimapa ============ */
const ms=d3.select("#miniSvg"); const full=bbox(all); const FW=full.x1-full.x0+60, FH=full.y1-full.y0+60;
ms.attr("viewBox",`${full.x0-30} ${full.y0-30} ${FW} ${FH}`).attr("preserveAspectRatio","xMidYMid meet");
const mg=ms.append("g"); const mvp=ms.append("rect").attr("class","vp");
function drawMini(){
  const v=visible();
  mg.selectAll("rect").data(v,d=>d.id).join(e=>e.append("rect").attr("rx",6),u=>u,x=>x.remove())
    .attr("x",d=>d.x).attr("y",d=>d.y-d.h/2+10).attr("width",d=>d.w).attr("height",d=>d.h-20).attr("fill",d=>d.depth===0?"#f2f2f2":d.color).attr("opacity",d=>d.depth===0?1:.85);
}
function updateVP(){ mvp.attr("x",-T.x/T.k).attr("y",-T.y/T.k).attr("width",W/T.k).attr("height",H/T.k); }
$("#mini").addEventListener("click",e=>{
  const r=$("#miniSvg").getBoundingClientRect(), s=Math.min(r.width/FW,r.height/FH), ox=(r.width-FW*s)/2, oy=(r.height-FH*s)/2;
  const wx=(e.clientX-r.left-ox)/s+full.x0-30, wy=(e.clientY-r.top-oy)/s+full.y0-30;
  goto(d3.zoomIdentity.translate(W/2-wx*T.k,H/2-wy*T.k).scale(T.k),600);
});

/* ============ Leyenda ============ */
$("#legend").innerHTML="<h4>Ramas del sistema</h4>"+branches.map(b=>`<div style="--c:${b.color}"><i></i>${b.t.length>34?b.t.slice(0,32)+"…":b.t}<b>${b.desc+1}</b></div>`).join("");

/* ============ Buscador ============ */
const q=$("#q"), res=$("#res"); let hits=[], act=-1;
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function runSearch(){
  const t=norm(q.value.trim()); hits=t?all.filter(n=>n.depth>0&&norm(n.t).includes(t)).slice(0,7):[]; act=-1; res.innerHTML="";
  hits.forEach(n=>{ const d=document.createElement("div"); d.style.setProperty("--c",n.color); d.innerHTML=`<i></i><span>${label(n)}</span><small>${n.code}</small>`; d.onmousedown=e=>{ e.preventDefault(); pick(n); }; res.appendChild(d); });
  res.classList.toggle("show",hits.length>0);
}
function pick(n){
  q.value=""; res.classList.remove("show"); q.blur();
  const chain=[]; for(let p=n.parent;p;p=p.parent) chain.unshift(p);
  chain.forEach((p,i)=>{ if(!p.open) expand(p,0); });
  $("#hint").classList.add("hide"); select(n); afterChange(null);
  setTimeout(()=>{ goto(d3.zoomIdentity.translate(W*.4-n.x*Math.max(T.k,.9),H/2-n.y*Math.max(T.k,.9)).scale(Math.max(T.k,.9))); n.el.classList.remove("ping"); void n.el.offsetWidth; n.el.classList.add("ping"); },500);
}
q.addEventListener("input",runSearch);
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; [...res.children].forEach((c,i)=>c.classList.toggle("act",i===act)); }
  else if(e.key==="Enter"&&hits.length) pick(hits[Math.max(0,act)]);
  else if(e.key==="Escape"){ q.value=""; runSearch(); q.blur(); }
});
q.addEventListener("blur",()=>setTimeout(()=>res.classList.remove("show"),150));

/* ============ Inicio ============ */
DATA.vis=true; DATA.el.classList.add("on");
d3.select(stage).call(zoom.transform,d3.zoomIdentity.translate(W*.14,H*.5+20).scale(1));
drawMini(); updateVP();
if(location.hash==="#todo") expandAll();
</script>
</body>
