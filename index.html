<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problemáticas de Kennedy</title>
<style>
  :root{
    --bg:#000; --fg:#f2f2f2; --muted:#8a8a8a;
    --root:#ff4d4d; --p1:#ff7eb6; --p2:#ffd166; --p3:#4cc9f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;
    background:radial-gradient(ellipse at center,#0d0d12 0%,#000 70%)}
  #stage.drag{cursor:grabbing}
  #stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.6}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #world.anim{transition:transform .9s cubic-bezier(.22,.8,.25,1)}
  #edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke-width:2;stroke-linecap:round;opacity:0;
    stroke-dasharray:1;stroke-dashoffset:1;transition:opacity .5s,stroke-dashoffset .7s ease}
  .edge.on{opacity:.55;stroke-dashoffset:0}

  .node{position:absolute;left:0;top:0;width:150px;margin-left:-75px;
    display:flex;flex-direction:column;align-items:center;
    opacity:0;pointer-events:none;
    transition:transform .75s cubic-bezier(.22,1.2,.36,1),opacity .45s}
  .node.on{opacity:1;pointer-events:auto}
  .orb{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
    font-size:28px;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 35%,#111),#0a0a0a 75%);
    border:2px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 25%,transparent);
    transition:transform .2s,box-shadow .2s}
  .node.has .orb{cursor:pointer}
  .node.has:hover .orb{transform:scale(1.12);box-shadow:0 0 28px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
  .node.sel .orb{box-shadow:0 0 34px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
  .node.has:not(.open) .orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:2px solid var(--c);opacity:.0;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.45);opacity:0}}
  .badge{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
    background:var(--c);color:#000;font-size:12px;font-weight:800;display:grid;place-items:center;
    box-shadow:0 0 8px var(--c)}
  .label{margin-top:8px;font-size:12px;line-height:1.25;text-align:center;color:#ddd;font-weight:600;
    text-shadow:0 0 6px #000,0 0 10px #000;max-width:150px}
  .node.root{width:200px;margin-left:-100px}
  .node.root .orb{width:120px;height:120px;font-size:54px;animation:beat 3s ease-in-out infinite}
  .node.root .label{font-size:15px;color:#fff;max-width:200px}
  @keyframes beat{0%,100%{box-shadow:0 0 26px var(--c),inset 0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
    50%{box-shadow:0 0 60px var(--c),inset 0 0 28px color-mix(in srgb,var(--c) 45%,transparent)}}
  .node.lvl1 .orb{width:84px;height:84px;font-size:36px}
  .node.lvl1 .label{font-size:14px;color:#fff;max-width:170px}
  .node.lvl1{width:170px;margin-left:-85px}

  #title{position:fixed;left:24px;top:20px;pointer-events:none;z-index:5}
  #title h1{font-size:22px;letter-spacing:.3px;font-weight:700}
  #title p{font-size:13px;color:var(--muted);margin-top:4px;max-width:300px}
  #hint{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:5;pointer-events:none;
    color:#ddd;font-size:14px;padding:8px 16px;border:1px solid #333;border-radius:20px;background:#000a;
    transition:opacity .5s;animation:float 2.4s ease-in-out infinite}
  #hint.hide{opacity:0}
  @keyframes float{50%{transform:translate(-50%,-6px)}}
  #legend{position:fixed;left:24px;bottom:24px;z-index:5;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#bbb}
  #legend span{display:flex;align-items:center;gap:8px}
  #legend i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor;background:currentColor}
  #tools{position:fixed;right:20px;bottom:20px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{background:#111;color:#eee;border:1px solid #333;border-radius:10px;padding:9px 13px;font-size:13px;
    cursor:pointer;font-family:inherit;transition:background .2s,border-color .2s}
  button:hover{background:#1c1c1c;border-color:#666}
  #card{position:fixed;right:20px;top:20px;width:min(320px,calc(100vw - 40px));z-index:6;padding:16px 18px;
    background:#0b0b0fee;border:1px solid var(--c,#333);border-radius:14px;
    box-shadow:0 0 24px color-mix(in srgb,var(--c,#333) 35%,transparent);
    opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
  #card.show{opacity:1;transform:none}
  #card .ic{font-size:26px}
  #card h2{font-size:16px;line-height:1.3;margin:6px 0 8px}
  #card .path{font-size:12px;color:var(--muted);line-height:1.5}
  #card .path b{color:#ccc;font-weight:600}
  @media (max-width:640px){
    #title h1{font-size:18px} #title p{display:none}
    #legend{display:none}
    #card{top:auto;bottom:70px;right:12px;left:12px;width:auto}
    #hint{bottom:130px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars"></canvas>
  <div id="world"><svg id="edges" width="1" height="1"></svg></div>
</div>

<div id="title">
  <h1>Problemáticas de Kennedy</h1>
  <p>Mapa causal de la fragmentación territorial. Haz clic en cada nodo para desplegarlo.</p>
</div>
<div id="hint">👆 Haz clic en la bolita central</div>
<div id="legend">
  <span style="color:var(--p1)"><i></i><em style="color:#bbb;font-style:normal">Hiperconcentración del mercado mayorista</em></span>
  <span style="color:var(--p2)"><i></i><em style="color:#bbb;font-style:normal">Saturación de los residuos</em></span>
  <span style="color:var(--p3)"><i></i><em style="color:#bbb;font-style:normal">Degradación del soporte ecológico</em></span>
</div>
<div id="tools">
  <button id="bExpand">✨ Expandir todo</button>
  <button id="bReset">↺ Reiniciar</button>
  <button id="bFit">⛶ Ajustar</button>
  <button id="bIn">＋</button>
  <button id="bOut">－</button>
</div>
<div id="card"><div class="ic"></div><h2></h2><div class="path"></div></div>

<script>
/* ---------- Datos (basados en el tablero de Miro) ---------- */
const DATA = {
  t:"La Fragmentación Territorial", i:"🧩", c:[
  { t:"Hiperconcentración del mercado mayorista", i:"🏬", color:"--p1", c:[
      { t:"Dependencia alimentaria", i:"🥫", c:[
        { t:"Pérdida de producción local", i:"🌾", c:[
          { t:"Modelo económico: más rentable convertir tierra rural en suelo urbano", i:"💰", c:[
            { t:"Crecimiento demográfico acelerado", i:"👨‍👩‍👧‍👦", c:[
              { t:"Expulsión violenta de millones de campesinos de sus tierras rurales", i:"🚜" }
            ]}
          ]}
        ]}
      ]},
      { t:"Modelo de higiene estatal y salubridad pública", i:"🧼", c:[
        { t:"Crisis epidémicas y brotes de enfermedades infecciosas", i:"🦠", c:[
          { t:"Descomposición acelerada de alimentos al aire libre", i:"🍎", c:[
            { t:"Carencia de infraestructura tecnológica", i:"🧊", c:[
              { t:"Industrialización tardía del país", i:"🏭", c:[
                { t:"La monoexportación cafetera", i:"☕" }
              ]}
            ]}
          ]}
        ]}
      ]},
      { t:"Sobrecarga de la red de transporte", i:"🚌", c:[
        { t:"Concentración espacial de origen y destino", i:"📍", c:[
          { t:"Densificación residencial en altura", i:"🏢", c:[
            { t:"Especulación del suelo", i:"📈", c:[
              { t:"Escasez de suelo", i:"🧱" }
            ]}
          ]},
          { t:"Clusters laborales", i:"💼", c:[
            { t:"Proceso histórico de expansión monocéntrica de Bogotá", i:"🗺️", c:[
              { t:"Economías de aglomeración", i:"🏙️" }
            ]}
          ]}
        ]},
        { t:"Desplazamientos masivos en franjas horarias específicas", i:"⏰", c:[
          { t:"Factores culturales e institucionales estandarizados", i:"🏛️" },
          { t:"Modelo de sincronización industrial y horarios rígidos", i:"⚙️" }
        ]}
      ]}
  ]},
  { t:"Saturación de los residuos", i:"🗑️", color:"--p2", c:[
      { t:"Presión sobre los sistemas de saneamiento", i:"🚰", c:[
        { t:"Generación de aguas residuales", i:"🚽", c:[
          { t:"Cargas contaminantes en aguas superficiales", i:"☣️" }
        ]}
      ]}
  ]},
  { t:"Degradación de la capacidad de soporte ecológico", i:"🌍", color:"--p3", c:[
      { t:"Deterioro de la calidad del aire", i:"🌫️", c:[
        { t:"Emisiones de NO₂ y CO", i:"🚗" }
      ]},
      { t:"Deterioro de la calidad del agua", i:"💧" },
      { t:"Pérdida de la biodiversidad", i:"🦋", c:[
        { t:"Falta de disponibilidad de hábitats naturales", i:"🦉" }
      ]},
      { t:"Vulnerabilidad frente a eventos de lluvia", i:"🌧️" },
      { t:"Planificación urbana orientada al mercado y no a la descentralización", i:"📐", c:[
        { t:"Transformación en superficies construidas", i:"🏗️", c:[
          { t:"Alteración de las condiciones del suelo", i:"🪨" },
          { t:"Impermeabilización del suelo", i:"🛣️" },
          { t:"Fragmentación de la cobertura vegetal", i:"🌿" },
          { t:"Pérdida de la cobertura vegetal", i:"🌳" }
        ]}
      ]}
  ]}
]};
// Orden en el círculo: mercado abajo, ecológico a la izquierda/arriba, residuos a la derecha.
DATA.c = [DATA.c[0], DATA.c[2], DATA.c[1]];

/* ---------- Layout radial ---------- */
const RING = 235, FIRST = 270;
let all = [], idn = 0;
function prep(n, parent, depth, color){
  n.id = idn++; n.parent = parent; n.depth = depth; n.open = false; n.vis = false;
  n.color = n.color ? getComputedStyle(document.documentElement).getPropertyValue(n.color).trim() : (color || getComputedStyle(document.documentElement).getPropertyValue("--root").trim());
  n.kids = n.c || [];
  all.push(n);
  n.kids.forEach(k => prep(k, n, depth+1, n.color));
  const sum = n.kids.reduce((s,k)=>s+k.w,0);
  n.w = Math.max(1, sum);
  if (depth === 1) n.w = Math.max(n.w, 3.5);
}
// peso necesario antes de asignar ángulos
function weight(n){ n.kids.forEach(weight); const s=n.kids.reduce((a,k)=>a+k.w,0); n.w=Math.max(1,s); if(n.depth===1)n.w=Math.max(n.w,3.5); }
prep(DATA, null, 0, null); weight(DATA);

function place(n, a0, a1){
  const a = (a0+a1)/2;
  const r = n.depth===0 ? 0 : FIRST + (n.depth-1)*RING;
  n.x = Math.cos(a)*r; n.y = Math.sin(a)*r;
  let cur = a0; const span = a1-a0, tot = n.kids.reduce((s,k)=>s+k.w,0);
  n.kids.forEach(k => { const s = span*k.w/tot; place(k, cur, cur+s); cur += s; });
}
const w1 = DATA.kids.reduce((s,k)=>s+k.w,0);
const bottomSpan = 2*Math.PI*DATA.kids[0].w/w1;
const startA = Math.PI/2 - bottomSpan/2;
place(DATA, startA, startA + 2*Math.PI);

/* ---------- DOM ---------- */
const stage = document.getElementById("stage");
const world = document.getElementById("world");
const svg   = document.getElementById("edges");
const card  = document.getElementById("card");
const hint  = document.getElementById("hint");
const NS = "http://www.w3.org/2000/svg";

all.forEach(n => {
  const el = document.createElement("div");
  el.className = "node lvl" + Math.min(n.depth,2) + (n.depth===0?" root":"") + (n.kids.length?" has":"");
  el.style.setProperty("--c", n.color);
  el.innerHTML = `<div class="orb">${n.i}${n.kids.length?`<span class="badge">${n.kids.length}</span>`:""}</div><div class="label"></div>`;
  el.querySelector(".label").textContent = n.t;
  n.el = el; world.appendChild(el);
  setPos(n, n.parent || n);
  if (n.parent){
    const p = document.createElementNS(NS,"path");
    p.setAttribute("class","edge"); p.setAttribute("pathLength","1");
    p.setAttribute("stroke", n.color);
    const mx=(n.parent.x+n.x)/2, my=(n.parent.y+n.y)/2;
    const dx=n.x-n.parent.x, dy=n.y-n.parent.y;
    p.setAttribute("d",`M${n.parent.x},${n.parent.y} Q${mx-dy*.12},${my+dx*.12} ${n.x},${n.y}`);
    svg.appendChild(p); n.edge = p;
  }
  el.addEventListener("click", e => { if (moved) return; e.stopPropagation(); select(n); toggle(n); });
});
function setPos(n, at){ n.el.style.transform = `translate(${at.x}px,${at.y}px)`; }

function show(n, origin){
  if (!n.vis){ setPos(n, origin||n.parent||n); void n.el.offsetWidth; }
  n.vis = true; n.el.classList.add("on"); setPos(n, n);
  if (n.edge) n.edge.classList.add("on");
}
function hide(n, origin){
  n.vis = false; n.open = false; n.el.classList.remove("on","open"); setPos(n, origin);
  if (n.edge) n.edge.classList.remove("on");
  n.kids.forEach(k => hide(k, origin));
}
function expand(n){ if(!n.kids.length) return; n.open=true; n.el.classList.add("open"); n.kids.forEach(k=>show(k,n)); setBadge(n); }
function collapse(n){ n.open=false; n.el.classList.remove("open"); n.kids.forEach(k=>hide(k,n)); setBadge(n); }
function setBadge(n){ const b=n.el.querySelector(".badge"); if(b) b.textContent = n.open ? "−" : n.kids.length; }
function toggle(n){
  if(!n.kids.length) return;
  n.open ? collapse(n) : expand(n);
  hint.classList.add("hide");
  fitTo(n.open ? [n, ...n.kids] : visibleNodes(), n.open);
}
function visibleNodes(){ return all.filter(n=>n.vis); }
function expandAll(){ all.forEach(n=>{ if(n.kids.length){ n.open=true; n.el.classList.add("open"); n.kids.forEach(k=>show(k,n)); setBadge(n);} }); fitTo(visibleNodes()); }
function reset(){ collapse(DATA); card.classList.remove("show"); all.forEach(n=>n.el.classList.remove("sel")); hint.classList.remove("hide"); fitTo([DATA]); }

function select(n){
  all.forEach(m=>m.el.classList.remove("sel")); n.el.classList.add("sel");
  const trail=[]; for(let p=n.parent;p;p=p.parent) trail.push(p.t);
  card.style.setProperty("--c", n.color);
  card.querySelector(".ic").textContent = n.i;
  card.querySelector("h2").textContent = n.t;
  card.querySelector(".path").innerHTML = trail.length
    ? "<b>Viene de:</b> " + trail.map(t=>t).join(" ← ")
    : "Todo el mapa parte de este fenómeno.";
  card.classList.add("show");
}
stage.addEventListener("click", e => { if(!moved && !e.target.closest(".node")){ card.classList.remove("show"); all.forEach(n=>n.el.classList.remove("sel")); } });

/* ---------- Cámara (pan + zoom) ---------- */
let cam = {x:0,y:0,k:1};
function apply(anim){
  world.classList.toggle("anim", !!anim);
  world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
}
function fitTo(nodes, onlyIfNeeded){
  const W=innerWidth, H=innerHeight, pad = 110;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n=>{ x0=Math.min(x0,n.x-85); x1=Math.max(x1,n.x+85); y0=Math.min(y0,n.y-60); y1=Math.max(y1,n.y+110); });
  const bw=x1-x0, bh=y1-y0;
  let k = Math.min((W-pad*2)/bw, (H-pad*2)/bh, 1.15);
  if (onlyIfNeeded) k = Math.min(cam.k, k);   // al expandir, nunca acercar más de lo actual
  k = Math.max(.18, k);
  cam = { k, x: W/2 - (x0+bw/2)*k, y: H/2 - (y0+bh/2)*k };
  apply(true);
}
let moved=false, drag=null;
stage.addEventListener("pointerdown", e=>{
  if (e.target.closest("button")) return;
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=false;
});
addEventListener("pointermove", e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!moved && Math.hypot(dx,dy)>5){ moved=true; stage.classList.add("drag"); }
  if(moved){ cam.x=drag.cx+dx; cam.y=drag.cy+dy; apply(false); }
});
addEventListener("pointerup", ()=>{ drag=null; stage.classList.remove("drag"); setTimeout(()=>moved=false,0); });
function zoomAt(f, cx, cy){
  const nk = Math.min(2.5, Math.max(.15, cam.k*f)), r = nk/cam.k;
  cam.x = cx - (cx-cam.x)*r; cam.y = cy - (cy-cam.y)*r; cam.k = nk; apply(false);
}
stage.addEventListener("wheel", e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX, e.clientY); }, {passive:false});
// pellizco táctil
const pts = new Map(); let pd=0;
stage.addEventListener("pointerdown", e=>pts.set(e.pointerId,e));
stage.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,e);
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd) zoomAt(d/pd,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2); pd=d; }
});
const endPt = e=>{ pts.delete(e.pointerId); pd=0; };
stage.addEventListener("pointerup",endPt); stage.addEventListener("pointercancel",endPt);

document.getElementById("bExpand").onclick = expandAll;
document.getElementById("bReset").onclick  = reset;
document.getElementById("bFit").onclick    = ()=>fitTo(visibleNodes());
document.getElementById("bIn").onclick     = ()=>zoomAt(1.25, innerWidth/2, innerHeight/2);
document.getElementById("bOut").onclick    = ()=>zoomAt(1/1.25, innerWidth/2, innerHeight/2);
addEventListener("resize", ()=>fitTo(visibleNodes()));

/* ---------- Fondo de estrellas ---------- */
const cv = document.getElementById("stars"), cx = cv.getContext("2d");
let S=[];
function sizeStars(){ cv.width=innerWidth; cv.height=innerHeight; S=Array.from({length:110},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:Math.random()*.02+.005})); }
function twinkle(t){ cx.clearRect(0,0,cv.width,cv.height); S.forEach(s=>{ cx.globalAlpha=.25+.6*Math.abs(Math.sin(s.p+t*s.s)); cx.fillStyle="#fff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); }); requestAnimationFrame(twinkle); }
sizeStars(); addEventListener("resize",sizeStars); requestAnimationFrame(twinkle);

/* ---------- Inicio: solo la bolita central ---------- */
show(DATA); DATA.el.classList.add("on");
cam = {x:innerWidth/2, y:innerHeight/2, k:1}; apply(false);
</script>
</body>
</html>
