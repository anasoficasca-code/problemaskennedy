<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Problemáticas de Kennedy · Mapa causal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --line:#252525; --line2:#383838; --fg:#f0f0f0; --mut:#8e8e8e; --dim:#5d5d5d;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans)}
  body{overflow:hidden;user-select:none;-webkit-user-select:none}
  svg{display:block}
  button{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;background:#0a0a0a;color:var(--fg);
    border:1px solid var(--line2);border-radius:10px;font:500 13px var(--sans);cursor:pointer;transition:background .15s,border-color .15s,transform .15s;white-space:nowrap}
  .btn:hover{background:#171717;border-color:#7d7d7d}
  .btn:active{transform:scale(.97)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pri{background:#f4f4f4;color:#000;border-color:#f4f4f4}.btn.pri:hover{background:#fff}

  /* =========================== ESCRITORIO =========================== */
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none;background:radial-gradient(ellipse 80% 60% at 30% 50%,#0c0c10 0%,#000 70%),#000}
  #stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#1d1d1d 1px,transparent 1.1px);background-size:26px 26px;pointer-events:none}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  .lane{position:absolute;border:1px dashed color-mix(in srgb,var(--c) 38%,#000);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,transparent),color-mix(in srgb,var(--c) 2%,transparent));
    opacity:0;pointer-events:none;transition:left .7s cubic-bezier(.3,.8,.3,1),top .7s cubic-bezier(.3,.8,.3,1),width .7s cubic-bezier(.3,.8,.3,1),height .7s cubic-bezier(.3,.8,.3,1),opacity .5s}
  .lane.on{opacity:1}
  .lane .chip{position:absolute;left:22px;top:-15px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;background:#000;border:1px solid color-mix(in srgb,var(--c) 55%,#000);border-radius:20px;
    font:500 11px var(--mono);letter-spacing:1.2px;color:var(--c);text-transform:uppercase;white-space:nowrap}
  .lane .chip svg{width:15px;height:15px}

  .base{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;
    stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1) var(--dl,0s),opacity .3s var(--dl,0s)}
  .base.on{opacity:.6;stroke-dashoffset:0}
  .flow{fill:none;stroke:var(--c);stroke-width:2.6;stroke-dasharray:1.5 13;stroke-linecap:round;opacity:0;transition:opacity .4s calc(var(--dl,0s) + .5s);animation:flow 1.1s linear infinite}
  .flow.on{opacity:1}
  @keyframes flow{to{stroke-dashoffset:-14.5}}
  .arrow{fill:var(--c);opacity:0;transition:opacity .25s calc(var(--dl,0s) + .55s)}
  .arrow.on{opacity:.95}
  .trav{fill:none;stroke:#fff;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.16 1.4;stroke-dashoffset:.16;opacity:0;filter:drop-shadow(0 0 5px var(--c))}
  .trav.go{opacity:1;animation:trav .75s cubic-bezier(.4,0,.6,1) forwards}
  .trav.go.rev{animation-name:travr}
  @keyframes trav{from{stroke-dashoffset:.16}to{stroke-dashoffset:-1}}
  @keyframes travr{from{stroke-dashoffset:-1}to{stroke-dashoffset:.16}}
  .dimL{opacity:.07!important}

  .lane{display:none!important}
  /* enlaces entre ramas (conexiones reales que cruzan el mapa): salen por arriba/abajo de la tarjeta, con degradado entre los colores de las dos ramas */
  .xl{fill:none;stroke-width:2.2;stroke-dasharray:7 6;stroke-linecap:round;opacity:0;transition:opacity .5s .4s,stroke-width .2s;animation:xflow 1.2s linear infinite}
  .xl.on{opacity:.5}
  .xl.sel{opacity:1!important;stroke-width:4.4;filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
  .xl.dimS{opacity:.1!important}
  .node.dimS{opacity:.2}
  .rtag{position:absolute;z-index:7;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:14px;background:#000;border:1px solid var(--c);color:var(--c);font:500 11px var(--mono);letter-spacing:.9px;text-transform:uppercase;white-space:nowrap;pointer-events:none;animation:rtin .7s cubic-bezier(.2,1.4,.3,1) both}
  .rtag svg{width:13px;height:13px}
  @keyframes rtin{from{opacity:0;transform:translateY(10px) scale(.6)}}
  .xl.hot{opacity:1;stroke-width:4}
  .xh{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:help}
  #tip{position:fixed;z-index:70;pointer-events:none;opacity:0;transform:translate(14px,14px);transition:opacity .15s;max-width:300px;padding:10px 12px;background:#0a0a0a;border:1px solid var(--line2);border-radius:12px;font:400 12.5px/1.35 var(--sans);color:#ddd}
  #tip.show{opacity:1}
  #tip b{display:block;font:500 10px var(--mono);letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
  #tip .r{display:flex;align-items:center;gap:8px;margin-top:4px}
  #tip .r i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
  #tip .ar{color:#fff;font-size:15px;margin:2px 0 0 1px}
  .ripple{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid var(--c);pointer-events:none;z-index:6;animation:rip .95s ease-out forwards}
  @keyframes rip{from{transform:translate(-50%,-50%) scale(1);opacity:.9}to{transform:translate(-50%,-50%) scale(13);opacity:0;border-width:.5px}}
  .glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(170px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 62%);z-index:2}
  .node:hover .glare{opacity:1}
  .node.on:hover{transform:translateY(-3px) scale(1.025);transition-delay:0s}
  .node.has:not(.open) .cnt{animation:cp 2.2s ease-in-out infinite}
  @keyframes cp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 32%,transparent)}}
  .node.on{animation:arrive .8s cubic-bezier(.2,1.3,.3,1) var(--dl,0s) both}
  @keyframes arrive{from{filter:brightness(2.2) blur(2px)}60%{filter:brightness(1.4)}to{filter:none}}
  .node.on.ping{animation:ping .9s ease-out}
  .xl.dimL{opacity:.06!important}
  @keyframes xflow{to{stroke-dashoffset:-24}}
  .xt{fill:none;stroke:#fff;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.16 1.4;stroke-dashoffset:.16;opacity:0;filter:drop-shadow(0 0 5px #fff)}
  .xt.go{opacity:1;animation:trav .8s cubic-bezier(.4,0,.6,1) forwards}.xt.go.rev{animation-name:travr}

  .node{position:absolute;display:flex;align-items:center;gap:13px;padding:0 15px 0 11px;overflow:hidden;
    background:linear-gradient(135deg,#171717,#0a0a0a 70%);border:1px solid var(--line2);border-radius:14px;cursor:pointer;opacity:0;pointer-events:none;
    transform:translate(var(--dx),var(--dy)) scale(.85);
    transition:transform .65s cubic-bezier(.2,.9,.3,1) var(--dl,0s),opacity .35s var(--dl,0s),border-color .2s,box-shadow .2s}
  .node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .node.bridge::before{background:linear-gradient(var(--c) 50%,var(--c2) 50%);width:5px}
  .node.on{opacity:1;pointer-events:auto;transform:none}
  .node:hover{border-color:color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 8px 28px -10px var(--c)}
  .node.sel{border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
  .node.dim{opacity:.16}
  .node.ping{animation:ping .9s ease-out}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 18px transparent}}
  .wm{position:absolute;right:-8px;bottom:-14px;width:74px;height:74px;color:var(--c);opacity:.07;pointer-events:none}
  .wm svg{width:100%;height:100%}
  .tile{flex:none;position:relative;z-index:1;width:48px;height:48px;border:1px solid color-mix(in srgb,var(--c) 50%,#000);border-radius:12px;display:grid;place-items:center;
    color:var(--c);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 22%,#000),color-mix(in srgb,var(--c) 6%,#000))}
  .tile svg{width:27px;height:27px}
  .txt{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .id{display:flex;align-items:center;gap:8px;font:500 10px var(--mono);letter-spacing:.8px;color:var(--dim)}
  .xb{display:inline-flex;align-items:center;gap:3px;padding:1px 6px 1px 4px;border-radius:9px;border:1px solid #444;color:#ddd;background:#0b0b0b}
  .xb svg{width:10px;height:10px}
  .lb{font:500 13.5px/1.17 var(--sans);color:var(--fg)}
  .cnt{position:relative;z-index:1;margin-left:auto;flex:none;display:flex;align-items:center;gap:3px;height:26px;padding:0 6px 0 9px;border-radius:13px;background:#000;border:1px solid var(--line2);font:500 11px var(--mono);color:var(--mut)}
  .cnt svg{width:13px;height:13px;transition:transform .25s}
  .node.open .cnt svg{transform:rotate(90deg)}
  .node.open .cnt{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,#000)}

  .node.d1{background:var(--c);border-color:var(--c);color:var(--ink)}
  .node.d1::before{background:rgba(0,0,0,.25)}
  .node.d1 .tile{width:62px;height:62px;border-radius:16px;color:var(--ink);border-color:color-mix(in srgb,var(--ink) 35%,transparent);background:color-mix(in srgb,var(--ink) 12%,transparent)}
  .node.d1 .tile svg{width:36px;height:36px}
  .node.d1 .lb{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.15}.node.d1 .id{color:color-mix(in srgb,var(--ink) 60%,transparent)}
  .node.d1 .wm{color:var(--ink);opacity:.12;width:110px;height:110px}
  .node.d1 .cnt{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
  .node.d1:hover{box-shadow:0 10px 34px -8px var(--c)}

  .node.d0{flex-direction:column;justify-content:center;gap:6px;text-align:center;padding:0 22px;background:var(--c);border:0;color:var(--ink);border-radius:34px}
  .node.d0::before{display:none}
  .node.d0 .tile{width:70px;height:70px;border-radius:20px;border:2px solid var(--ink);background:transparent;color:var(--ink)}
  .node.d0 .tile svg{width:40px;height:40px}
  .node.d0 .txt{align-items:center}
  .node.d0 .lb{color:var(--ink);font-size:14px;font-weight:700}.node.d0 .id{color:color-mix(in srgb,var(--ink) 60%,transparent);letter-spacing:1.6px;justify-content:center}
  .node.d0 .cnt{margin:2px 0 0;background:#000;border-color:#000;color:#fff;height:24px}
  .node.d0 .wm{display:none}
  .node.d0::after{content:"";position:absolute;inset:-1px;border-radius:34px;border:2px solid var(--c);opacity:0;animation:ring 2.4s ease-out infinite;pointer-events:none}
  .node.d0.open::after{display:none}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.25,1.4);opacity:0}}

  #bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px;background:linear-gradient(#000 55%,rgba(0,0,0,0));pointer-events:none}
  #bar>*{pointer-events:auto}
  #brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
  .logo{flex:none;width:40px;height:40px;border-radius:11px;background:#f4f4f4;color:#000;display:grid;place-items:center}
  .logo svg{width:23px;height:23px}
  #brand h1{font:700 17px var(--sans);letter-spacing:-.1px;white-space:nowrap}
  #brand p{font:400 10px var(--mono);letter-spacing:1.5px;color:var(--mut);margin-top:3px;text-transform:uppercase}
  .search{position:relative;width:260px}
  .search input{width:100%;height:38px;background:#0a0a0a;color:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 12px 0 38px;font:400 14px var(--sans);outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text}
  .search input:focus{border-color:#9a9a9a}
  .search input::placeholder{color:#666}
  .search>svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:#777}
  .res{position:absolute;left:0;right:0;top:44px;background:#0a0a0a;border:1px solid var(--line2);border-radius:10px;display:none;max-height:320px;overflow:auto;z-index:30}
  .res.show{display:block}
  .res div{padding:10px 12px;font:400 13px/1.3 var(--sans);cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #151515}
  .res div:last-child{border:0}
  .res div:hover,.res div.act{background:#171717}
  .ri{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#000)}
  .ri svg{width:15px;height:15px}
  .res small{font:400 10px var(--mono);color:var(--dim);margin-left:auto;flex:none}
  #bPal{width:38px;padding:0}
  #palpop{position:fixed;right:20px;top:64px;z-index:60;width:250px;padding:10px;background:rgba(8,8,8,.97);border:1px solid var(--line2);border-radius:16px;display:none;flex-direction:column;gap:4px}
  #palpop.show{display:flex}
  #palpop h5{font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:4px 6px 6px}
  .pitem{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;cursor:pointer;font:500 13px var(--sans);color:#ddd;border:1px solid transparent}
  .pitem:hover{background:#151515}.pitem.act{border-color:#fff;background:#121212}
  .sw{display:flex}.sw i{width:20px;height:20px;border-radius:50%;margin-left:-6px;border:2px solid #080808}.sw i:first-child{margin-left:0}
  .pitem svg{margin-left:auto;width:16px;height:16px;color:#fff}

  #hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;align-items:center;gap:10px;
    font:500 11px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--fg);padding:11px 16px;border:1px solid var(--line2);border-radius:30px;background:#050505;
    animation:hb 2s ease-in-out infinite;transition:opacity .4s;white-space:nowrap;max-width:92vw}
  #hint svg{width:16px;height:16px;flex:none}
  #hint.hide{opacity:0}
  @keyframes hb{50%{transform:translate(-50%,-6px)}}
  #legend{position:fixed;left:16px;bottom:16px;z-index:15;display:flex;flex-direction:column;gap:2px;padding:8px;background:rgba(6,6,6,.9);border:1px solid var(--line);border-radius:14px;width:auto}
  #legend:not(.open) h4,#legend:not(.open) .key,#legend:not(.open) #stat,#legend:not(.open) .li span,#legend:not(.open) .li b{display:none}
  #legend.open{width:250px;padding:12px}
  #legend .li{padding:4px}
  .lt{display:grid;place-items:center;width:30px;height:30px;margin:0 0 4px;border-radius:9px;background:#111;border:1px solid var(--line2);color:#bbb;cursor:pointer}
  .lt:hover{background:#1a1a1a;color:#fff}.lt svg{width:15px;height:15px}
  #legend h4{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:4px 4px 5px}
  #legend h4 svg{width:13px;height:13px}#legend h4:not(:first-child){margin-top:10px}
  .li{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:9px;font:400 12.5px var(--sans);color:#d0d0d0;cursor:pointer;transition:background .15s}
  .li:hover,.li.act{background:#171717}.li.act{outline:1px solid var(--c)}
  .li i{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--c)}
  .li i svg{width:16px;height:16px}
  .li b{margin-left:auto;padding-left:10px;font:500 11px var(--mono);color:var(--mut)}
  .key{display:flex;align-items:center;gap:10px;padding:3px 6px;font:400 12px var(--sans);color:#b8b8b8}
  .key svg{flex:none;width:34px;height:14px;overflow:visible}
  #stat{display:flex;gap:8px;margin:8px 2px 2px}
  #stat div{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#0b0b0b}
  #stat b{display:block;font:500 15px var(--mono);color:#fff}#stat span{font:400 10px var(--sans);color:var(--mut)}
  #mini{position:fixed;right:16px;bottom:16px;z-index:15;width:170px;height:104px;background:#060606;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
  #mini svg{width:100%;height:100%}
  #mini .vp{fill:rgba(255,255,255,.07);stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
  #zoom{position:fixed;right:16px;bottom:132px;z-index:15;display:flex;flex-direction:column;gap:6px}
  #zoom .btn{width:38px;padding:0}
  #insp{position:fixed;right:16px;top:70px;width:262px;max-height:calc(100vh - 230px);overflow:auto;z-index:18;padding:14px;background:#080808;border:1px solid var(--line2);border-radius:16px;
    opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .25s,transform .25s;user-select:text;-webkit-user-select:text}
  #insp.show{opacity:1;transform:none;pointer-events:auto}
  #iClose,#cClose{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:8px;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center}
  #iClose:hover,#cClose:hover{background:#171717;color:#fff}#iClose svg,#cClose svg{width:16px;height:16px}

  .ih{display:flex;align-items:center;gap:13px;padding-right:26px}
  .ih .it{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--c)}
  .ih .it svg{width:24px;height:24px}
  .ih .ic{font:500 10.5px var(--mono);letter-spacing:1.2px;color:var(--mut);text-transform:uppercase}
  .ih h2{font:700 14.5px/1.22 var(--sans);margin-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:20px;font:500 11.5px var(--sans);color:#ddd;border:1px solid color-mix(in srgb,var(--c) 50%,#000);background:color-mix(in srgb,var(--c) 10%,#000)}
  .chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--c)}.chip i svg{width:11px;height:11px}
  .isec{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:18px 0 9px}
  .isec svg{width:13px;height:13px}.isec b{margin-left:auto;color:var(--mut)}
  .ipath div{position:relative;padding:0 0 10px 22px;font:400 13px/1.3 var(--sans);color:#bcbcbc}
  .ipath div::before{content:"";position:absolute;left:3px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--pc,var(--c))}
  .ipath div::after{content:"";position:absolute;left:7px;top:16px;bottom:-1px;width:1px;background:var(--line2)}
  .ipath div:last-child::after{display:none}
  .ipath div:last-child{color:#fff;font-weight:600;padding-bottom:0}
  .rel{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:10px;cursor:pointer;font:400 12px/1.25 var(--sans);color:#d4d4d4;transition:background .15s}
  .rel:hover{background:#151515}.rel .ri{width:26px;height:26px;border-radius:8px}.rel .ri svg{width:15px;height:15px}
  .rel small{margin-left:auto;font:400 10px var(--mono);color:var(--dim);flex:none}
  .rel.hid{opacity:.6}
  .istats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .istats div{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#0c0c0c}
  .istats svg{width:15px;height:15px;color:var(--c);margin-bottom:6px}
  .istats b{display:block;font:500 16px var(--mono);color:#fff}.istats span{font:400 10.5px var(--sans);color:var(--mut)}
  .iact{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.iact .btn{flex:1;padding:0 8px;height:34px;font-size:12px}

function stepAnim(k1,k2){ // conector que une dos variables y si el pulso va en contra de la flecha dibujada
  const a=KK[k1], b=KK[k2];
  const child = a.parent===b ? a : b.parent===a ? b : null;
  if(child && child.trav){ const src=child.srcIsChild?child:child.parent; return {el:child.trav, flip:(a!==src)}; }
  const x=xedges.find(x=>(x.s===a&&x.t===b)||(x.s===b&&x.t===a)); if(x) return {el:x.tr, flip:(a!==x.s)};

    if(step.length){ const d=lv*900;
      timers.push(setTimeout(()=>step.forEach(s=>{ const an=stepAnim(s.a.key,s.b.key); if(an&&!isMobile()){ an.el.classList.remove("go","rev"); void an.el.getBoundingClientRect(); an.el.classList.add("go"); if(an.flip) an.el.classList.add("rev"); } }),d));

const padR=()=>70;
function fit(ns){ const v=ns||all.filter(n=>n.vis), b=bbox(v), pad={l:padL(),r:padR(),t:110,b:100};
  const k=Math.min((W-pad.l-pad.r)/(b.x1-b.x0+60),(H-pad.t-pad.b)/(b.y1-b.y0+80),1.15);
  goto(d3.zoomIdentity.translate(pad.l+(W-pad.l-pad.r-(b.x1-b.x0)*k)/2-b.x0*k,pad.t+(H-pad.t-pad.b-(b.y1-b.y0)*k)/2-b.y0*k).scale(k)); }
function reveal(ns){ const b=bbox(ns), pad={l:padL(),r:padR(),t:110,b:110};
  let k=T.k; const need=Math.min((W-pad.l-pad.r)/(b.x1-b.x0+40),(H-pad.t-pad.b)/(b.y1-b.y0+60)); if(need<k) k=Math.max(.25,need);
  let tx=T.x, ty=T.y; const L=b.x0*k+tx, R=b.x1*k+tx, Tp=b.y0*k+ty, B=b.y1*k+ty;
  if(L<pad.l) tx+=pad.l-L; else if(R>W-pad.r) tx-=R-(W-pad.r); if(Tp<pad.t) ty+=pad.t-Tp; else if(B>H-pad.b) ty-=B-(H-pad.b);

    const txt=!x.dir?"relacionada":(x.s===n?"efecto de esta":"causa de esta"), ic=!x.dir?"Link":(x.s===n?"ArrowDownToLine":"ArrowUpFromLine");
    const t=document.createElement("div"); t.className="rtag"; t.style.setProperty("--c",o.color); t.style.left=o.x+"px"; t.style.top=(o.y-o.h/2-32)+"px"; t.innerHTML=icon(ic,2.2)+txt; world.appendChild(t); });
}
function applySelFocus(){
  const n=sel; all.forEach(m=>m.el.classList.remove("dimS")); xedges.forEach(x=>x.p.classList.remove("sel","dimS"));
  if(!n||!n.xs.length||isMobile()) return;
  const keep=new Set([n,n.parent,...n.kids,...n.xs.map(x=>x.s===n?x.t:x.s)]);
  all.forEach(m=>{ if(m.vis&&!keep.has(m)) m.el.classList.add("dimS"); });
  xedges.forEach(x=>{ const mine=x.s===n||x.t===n; x.p.classList.toggle("sel",mine); x.p.classList.toggle("dimS",!mine); });
}
function focusOn(n){
  if(isMobile()) return;
  let changed=false; n.xs.forEach(x=>{ const o=x.s===n?x.t:x.s; if(!o.vis){ for(let p=o.parent;p;p=p.parent){ if(!p.open){ p.open=true; changed=true; } } } });
  if(changed) refresh(n);
  const partners=n.xs.map(x=>x.s===n?x.t:x.s);
  zoomTo([n,...(n.open?n.kids:[]),...(n.parent?[n.parent]:[]),...partners]);
  applySelFocus(); showRelTags(n);
}

/* ============ Buscador (escritorio y móvil) ============ */
function wireSearch(inp,resBox){
  let hits=[], act=-1;
  const run=()=>{ const t=norm(inp.value.trim()); hits=t?all.filter(n=>n.depth>0&&(norm(n.t).includes(t)||norm(n.s).includes(t))).slice(0,7):[]; act=-1; resBox.innerHTML="";
    hits.forEach(n=>{ const d=document.createElement("div"); d.style.setProperty("--c",n.color); d.innerHTML=`<span class="ri">${icon(n.i)}</span><span>${n.s}</span><small>${n.code}</small>`; d.onmousedown=d.ontouchstart=e=>{ e.preventDefault(); pick(n); }; resBox.appendChild(d); });
    resBox.classList.toggle("show",hits.length>0); };
  const pick=n=>{ inp.value=""; resBox.classList.remove("show"); inp.blur(); $("#msw").classList.remove("show"); goNode(n); };
  inp.addEventListener("input",run);
  inp.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; act=(act+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; [...resBox.children].forEach((c,i)=>c.classList.toggle("act",i===act)); }
    else if(e.key==="Enter"&&hits.length) pick(hits[Math.max(0,act)]); else if(e.key==="Escape"){ inp.value=""; run(); inp.blur(); } });
  inp.addEventListener("blur",()=>setTimeout(()=>resBox.classList.remove("show"),180));
}

  const cur=$("#cur"), cur2=$("#cur2"), root=document.documentElement; let tx=-100,ty=-100,x=-100,y=-100,shown=false;
  root.style.setProperty("--cc",P.c1);
  addEventListener("mousemove",e=>{ tx=e.clientX; ty=e.clientY; if(!shown){ shown=true; x=tx; y=ty; cur.style.opacity=cur2.style.opacity=1; }
    cur.style.transform=`translate(${tx}px,${ty}px) translate(-50%,-50%)`;
    const t=e.target, hov=t.closest&&t.closest(".node,.btn,button,a,.li,.pitem,.rel,.xh,.res div,.lt,.xchip,.pitem"), nd=t.closest&&t.closest(".node");
    document.body.classList.toggle("cur-hover",!!hov);
    root.style.setProperty("--cc", nd? (nd.style.getPropertyValue("--c")||P.c1) : P.c1); });
  addEventListener("mousedown",()=>document.body.classList.add("cur-down")); addEventListener("mouseup",()=>document.body.classList.remove("cur-down"));
  document.addEventListener("mouseleave",()=>{ cur.style.opacity=cur2.style.opacity=0; shown=false; });
  (function loop(){ x+=(tx-x)*.2; y+=(ty-y)*.2; cur2.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`; requestAnimationFrame(loop); })();
}
